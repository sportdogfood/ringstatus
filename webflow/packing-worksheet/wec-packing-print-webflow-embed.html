<div id="wec-packing-print">Loading WEC print...</div>

<script>
  (function () {
    var root = document.getElementById("wec-packing-print");
    var assetVersion = root && root.dataset.rsBuild ? root.dataset.rsBuild.trim() : "";
    if (!root || !assetVersion) {
      if (root) root.textContent = "Missing data-rs-build on #wec-packing-print.";
      return;
    }
    var cacheKey = "wec-print-20260601-" + assetVersion;
    var assetBase = "https://cdn.jsdelivr.net/gh/sportdogfood/ringstatus@" + assetVersion + "/webflow/packing-worksheet";

    window.WEC_PACKING_PRINT_CONFIG = {
      apiUrl: "https://ringstatus.com/test/wec-packing/print"
    };

    function addStyle(href) {
      var link = document.createElement("link");
      link.rel = "stylesheet";
      link.href = href;
      document.head.appendChild(link);
    }

    function addScript(src) {
      var script = document.createElement("script");
      script.src = src;
      document.head.appendChild(script);
    }

    addStyle("https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap");
    addStyle(assetBase + "/wec-packing-print.css?v=" + cacheKey);
    addScript(assetBase + "/wec-packing-print.js?v=" + cacheKey);
  })();
</script>
