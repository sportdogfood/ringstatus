<main id="packing-app" class="rsa-dashboard">
  <div id="packing-home" data-pack-wave-key="wave_one">Loading packing home...</div>
</main>

<script>
  (function () {
    var root = document.getElementById("packing-home");
    var builds = window.RS_BUILDS || {};
    var assetVersion = (builds.pages && builds.pages["packing-home"]) || builds.current || "main";
    var cacheKey = "packing-home-20260604-" + assetVersion;
    var assetBase = "https://cdn.jsdelivr.net/gh/sportdogfood/ringstatus@" + assetVersion + "/webflow/packing-worksheet";

    if (!root) return;

    root.dataset.apiUrl = "https://ringstatus.com/test/wec-packing/home";
    root.dataset.sessionUrl = "https://ringstatus.com/test/wec-packing/session";
    root.dataset.packWaveKey = root.dataset.packWaveKey || "wave_one";
    root.dataset.viewKey = root.dataset.viewKey || root.dataset.packWaveKey || "wave_one";

    function addStyle(href) {
      var link = document.createElement("link");
      link.rel = "stylesheet";
      link.href = href;
      document.head.appendChild(link);
    }

    function addScript(src) {
      var script = document.createElement("script");
      script.src = src;
      script.defer = true;
      document.head.appendChild(script);
    }

    addStyle("https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap");
    addStyle(assetBase + "/rsa-stylesheets.locked.css?v=" + cacheKey);
    addStyle(assetBase + "/styles.css?v=" + cacheKey);
    addStyle(assetBase + "/horse-kits-static-proof.css?v=" + cacheKey);
    addScript(assetBase + "/packing-home.js?v=" + cacheKey);
  })();
</script>
