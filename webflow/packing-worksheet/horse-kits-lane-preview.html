<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="cache-control" content="no-store">
    <title>Horse Kits Lane Preview</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./rsa-stylesheets.locked.css">
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <div id="packing-app">
      <div class="rsa-dashboard-block">
        <div class="rsa-dashboard-container">
          <div class="rsa-main-grid">
            <section class="rsa-top">
              <div class="rsa-padding">
                <div class="rsa-banner-header">
                  <div class="rsa-head-left">
                    <div class="rsa-report-title rsa-H1">WEC PACK LIST</div>
                    <div class="rsa-report-subtitle rsa-text">Horse Kits Test | Wave One</div>
                  </div>
                </div>
              </div>
            </section>

            <section class="rsa-actions">
              <div class="rsa-padding">
                <div class="rsa-list-action-menu packing-section-tabs">
                  <a class="rs-tab-link rsa-text is-link is-section-tab is-overview" href="#">WAVE ONE</a>
                  <a class="rs-tab-link rsa-text is-link is-section-tab is-horses is-active" href="#">HORSES (35)</a>
                  <a class="rs-tab-link rsa-text is-link is-section-tab is-barn" href="#">COMMENTS</a>
                </div>
              </div>
            </section>

            <section class="rsa-body">
              <div class="rsa-content table-module">
                <div class="rsa-top is-hidden"></div>

                <div class="rsa-body">
                  <div class="rsa-content">
                    <div class="rsa-top">
                      <div class="rsa-padding">
                        <div class="rsa-banner-header">
                          <div class="rsa-head-left">
                            <div class="rsa-head rsa-H5 is-caps">HORSE KITS</div>
                            <a class="rs-text-link rsa-text is-link is-xxs" href="#">EDIT</a>
                          </div>
                          <div class="rsa-head-right">
                            <a class="rs-text-link rsa-text is-link" href="#">SEARCH</a>
                          </div>
                        </div>
                      </div>
                    </div>

                    <div class="rsa-actions">
                      <div class="rsa-padding">
                        <div class="rsa-list-action-menu packing-section-tabs">
                          <a class="rs-tab-link rsa-text is-link is-section-tab is-active" href="#">ALL (50)</a>
                          <a class="rs-tab-link rsa-text is-link is-section-tab" href="#">WAVE 1 (35)</a>
                          <a class="rs-tab-link rsa-text is-link is-section-tab" href="#">NOT GOING (15)</a>
                        </div>
                      </div>
                    </div>

                    <div class="rsa-body">
                      <div class="rsa-padding">
                        <div class="rsa-table-head">
                          <div class="rsa-item-row-2 is-grid2">
                            <div class="rsa-item-block-left">
                              <div class="rsa-item-text">
                                <div class="indication-color is-spacer"></div>
                                <button type="button" class="rsa-table-label rsa-text is-xs is-caps">HORSE</button>
                              </div>
                            </div>
                            <div class="rsa-item-block-right">
                              <div class="rs-quantity-block-2 is-grid4 has-inline-qty-action">
                                <button type="button" class="rsa-table-label rsa-text is-xs is-caps">NEED</button>
                                <button type="button" class="rsa-table-label rsa-text is-xs is-caps">PACKED</button>
                                <button type="button" class="rsa-table-label rsa-text is-xs is-caps">LEFT</button>
                                <div class="rsa-table-label rsa-text is-xs is-caps">OPEN</div>
                              </div>
                            </div>
                          </div>
                        </div>

                        <div class="rsa-table-body">
                          <button class="rsa-item-row-2 is-grid2 is-hot-row" type="button">
                            <div class="rsa-item-block-left">
                              <div class="rsa-item-text">
                                <div class="indication-color bg-primary-blue"></div>
                                <div class="rs-table-title rsa-text is-line-item">BEN</div>
                                <div class="rs-text-linline rsa-text is-xs">3% PACKED</div>
                              </div>
                            </div>
                            <div class="rsa-item-block-right">
                              <div class="rs-quantity-block-2 is-grid4 has-inline-qty-action">
                                <div class="rs-text-2 rsa-text is-number">40</div>
                                <div class="rs-text-2 rsa-text is-number">1</div>
                                <div class="rs-text-2 rsa-text is-number">39</div>
                                <div class="rs-input-inline rsa-text is-inline-input is-link is-open-action">OPEN <span class="rsa-open-icon" aria-hidden="true"></span></div>
                              </div>
                            </div>
                          </button>

                          <button class="rsa-item-row-2 is-grid2 is-hot-row" type="button">
                            <div class="rsa-item-block-left">
                              <div class="rsa-item-text">
                                <div class="indication-color bg-primary-blue"></div>
                                <div class="rs-table-title rsa-text is-line-item">RANGER</div>
                                <div class="rs-text-linline rsa-text is-xs">0% PACKED</div>
                              </div>
                            </div>
                            <div class="rsa-item-block-right">
                              <div class="rs-quantity-block-2 is-grid4 has-inline-qty-action">
                                <div class="rs-text-2 rsa-text is-number">39</div>
                                <div class="rs-text-2 rsa-text is-number">0</div>
                                <div class="rs-text-2 rsa-text is-number">39</div>
                                <div class="rs-input-inline rsa-text is-inline-input is-link is-open-action">OPEN <span class="rsa-open-icon" aria-hidden="true"></span></div>
                              </div>
                            </div>
                          </button>

                          <button class="rsa-item-row-2 is-grid2 is-hot-row" type="button">
                            <div class="rsa-item-block-left">
                              <div class="rsa-item-text">
                                <div class="indication-color bg-primary-blue"></div>
                                <div class="rs-table-title rsa-text is-line-item">ARROW</div>
                                <div class="rs-text-linline rsa-text is-xs">0% PACKED</div>
                              </div>
                            </div>
                            <div class="rsa-item-block-right">
                              <div class="rs-quantity-block-2 is-grid4 has-inline-qty-action">
                                <div class="rs-text-2 rsa-text is-number">40</div>
                                <div class="rs-text-2 rsa-text is-number">0</div>
                                <div class="rs-text-2 rsa-text is-number">40</div>
                                <div class="rs-input-inline rsa-text is-inline-input is-link is-open-action">OPEN <span class="rsa-open-icon" aria-hidden="true"></span></div>
                              </div>
                            </div>
                          </button>

                          <button class="rsa-item-row-2 is-grid2 is-hot-row" type="button">
                            <div class="rsa-item-block-left">
                              <div class="rsa-item-text">
                                <div class="indication-color bg-primary-blue"></div>
                                <div class="rs-table-title rsa-text is-line-item">CALOU</div>
                                <div class="rs-text-linline rsa-text is-xs">NOT GOING</div>
                              </div>
                            </div>
                            <div class="rsa-item-block-right">
                              <div class="rs-quantity-block-2 is-grid4 has-inline-qty-action">
                                <div class="rs-text-2 rsa-text is-number">0</div>
                                <div class="rs-text-2 rsa-text is-number">0</div>
                                <div class="rs-text-2 rsa-text is-number">0</div>
                                <div class="rs-input-inline rsa-text is-inline-input is-link is-open-action">OPEN <span class="rsa-open-icon" aria-hidden="true"></span></div>
                              </div>
                            </div>
                          </button>
                        </div>

                        <div class="rsa-table-foot">
                          <div class="rsa-item-row-2 is-grid2">
                            <div class="rsa-item-block-left">
                              <div class="rsa-item-text">
                                <div class="indication-color is-spacer"></div>
                                <div class="rsa-table-label rsa-text is-xs is-caps">TOTALS</div>
                              </div>
                            </div>
                            <div class="rsa-item-block-right">
                              <div class="rs-quantity-block-2 is-grid4 has-inline-qty-action">
                                <div class="rsa-table-label rsa-text is-xs is-caps">119</div>
                                <div class="rsa-table-label rsa-text is-xs is-caps">1</div>
                                <div class="rsa-table-label rsa-text is-xs is-caps">118</div>
                                <div class="rsa-table-label"></div>
                              </div>
                            </div>
                          </div>
                        </div>
                      </div>
                    </div>

                    <div class="rsa-bottom">
                      <div class="rsa-padding">
                        <div class="rsa-comment-panel">
                          <div class="rsa-comment rsa-comment-head">
                            <div class="rsa-comment-wrapper">
                              <div class="rsa-comment-text rsa-text">All Horse Kits comments</div>
                              <a class="rsa-comment-action rsa-text is-link" href="#">ADD</a>
                            </div>
                          </div>
                          <div class="rsa-comment rsa-comment-item">
                            <div class="rsa-comment-wrapper">
                              <div class="rsa-comment-text rsa-text">No Horse Kits comments</div>
                            </div>
                          </div>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </section>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
