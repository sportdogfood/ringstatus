<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RingStatus Recognition Product Test</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; color: #142236; background: #f4f1eb; font-family: Inter, Arial, sans-serif; }
    nav { height: 72px; padding: 0 clamp(20px,5vw,72px); display: flex; align-items: center; justify-content: space-between; color: #fff; background: #10243c; }
    nav a { color: inherit; text-decoration: none; }
    .brand { font: 24px Georgia,serif; }
    .rsn-nav-button.is-members.w-button { padding: 10px 18px; border: 1px solid #ffffff66; border-radius: 999px; }
    main { padding: clamp(52px,10vw,120px) clamp(20px,7vw,100px); }
    h1 { max-width: 760px; margin: 0; font: 400 clamp(44px,7vw,88px)/.98 Georgia,serif; letter-spacing: -.04em; }
    main p { max-width: 590px; color: #667080; font-size: 17px; line-height: 1.65; }
    #rs-preview-controls { position: fixed; left: 16px; bottom: 16px; z-index: 100; padding: 10px; border: 1px solid #dfe3e8; border-radius: 12px; background: #fff; box-shadow: 0 10px 30px #1422361a; }
    #rs-preview-controls p { margin: 0 0 8px; color: #667080; font-size: 11px; }
    #rs-preview-controls button { padding: 7px 9px; border: 1px solid #dfe3e8; border-radius: 7px; background: #fff; cursor: pointer; }
  </style>
</head>
<body>
  <nav>
    <a class="brand" href="/">RingStatus</a>
    <a class="rsn-nav-button is-members w-button" id="rs-members-button" href="/members">Members</a>
  </nav>
  <main>
    <h1>Know what’s happening at the ring.</h1>
    <p>The production recognition widget is loaded below. Its UI states use the real widget; form actions call the test identity API.</p>
  </main>
  <aside id="rs-preview-controls">
    <p>Product states</p>
    <button type="button" data-rs-preview-state="recognized">Recognized</button>
    <button type="button" data-rs-preview-state="quiet">Quiet</button>
    <button type="button" data-rs-preview-state="members">Members gate</button>
  </aside>
  <script
    src="../../webflow-cloud-test/public/rs-recognition.js"
    data-rs-api-base="https://ringstatus.webflow.io/test/rs-recognition"
    data-rs-preview="true"
  ></script>
</body>
</html>
