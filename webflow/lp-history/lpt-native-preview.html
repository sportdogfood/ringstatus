<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LPT native interaction preview</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f7f8fa; color: #000; font: 20px/0.95 Outfit, Arial, sans-serif; }
    .lpt-shell { width: min(1180px, calc(100% - 32px)); margin: auto; padding: 16px 16px 96px; }
    .lpt-nav { position: sticky; top: 0; display: flex; gap: 8px; margin-bottom: 16px; padding: 10px; overflow-x: auto; background: #fff; }
    .lpt-nav a { padding: 16px; background: #eee; color: #000; text-decoration: none; }
    .lpt-section { margin-bottom: 16px; overflow: hidden; background: #fff; border-radius: 6px; }
    .lpt-section-head { display: flex; align-items: center; min-height: 54px; padding: 12px 16px; }
    .lpt-section-title { margin: 0; font-size: 20px; }
    .lpt-section-link { margin-left: auto; }
    .lpt-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; padding: 6px; }
    .lpt-card { display: flex; min-height: 350px; padding: 12px 16px; flex-direction: column; background: white; border: 1px solid #eee; color: #000; text-decoration: none; }
    .lpt-card-media { height: 220px; margin-bottom: 12px; background: rgba(175, 175, 175, 0.11); }
    .lpt-card-title { font-weight: 600; }
    .lpt-card-meta { margin-top: 8px; font-size: 16px; }
    .lpt-drawer { position: fixed; inset: auto 0 0; height: 72vh; padding: 18px 16px 24px; background: white; overflow: auto; }
    .lpt-drawer-close { float: right; width: 40px; height: 40px; }
  </style>
  <link rel="stylesheet" href="http://127.0.0.1:8793/lpt/client.css">
  <script src="http://127.0.0.1:8793/lpt/client.js" defer></script>
</head>
<body>
  <div class="lpt-shell">
    <nav class="lpt-nav">
      <a class="lpt-nav-current" href="#">Home</a>
      <a class="lpt-nav-item" href="#">Profile</a>
      <a class="lpt-nav-item" href="#">Horses</a>
      <a class="lpt-nav-item" href="#">Shows</a>
      <a class="lpt-nav-item" href="#">Classes</a>
      <a class="lpt-nav-item" href="#">Videos</a>
    </nav>
    <section class="lpt-section">
      <div class="lpt-section-head">
        <h2 class="lpt-section-title">Horses</h2>
        <a class="lpt-section-link" href="#">See all horses</a>
      </div>
      <div class="lpt-grid">
        <a class="lpt-card" href="#lp-detail-drawer"><div class="lpt-card-media"></div><strong class="lpt-card-title">Oddur van Beaugaarde</strong><span class="lpt-card-meta">Horse profile</span></a>
        <a class="lpt-card" href="#lp-detail-drawer"><div class="lpt-card-media"></div><strong class="lpt-card-title">Troubleshoot</strong><span class="lpt-card-meta">Horse profile</span></a>
        <a class="lpt-card" href="#lp-detail-drawer"><div class="lpt-card-media"></div><strong class="lpt-card-title">Fort Knox</strong><span class="lpt-card-meta">Horse profile</span></a>
        <a class="lpt-card" href="#lp-detail-drawer"><div class="lpt-card-media"></div><strong class="lpt-card-title">Shelby Blue PS</strong><span class="lpt-card-meta">Horse profile</span></a>
        <a class="lpt-card" href="#lp-detail-drawer"><div class="lpt-card-media"></div><strong class="lpt-card-title">Q-2</strong><span class="lpt-card-meta">Horse profile</span></a>
      </div>
    </section>
    <aside class="lpt-drawer" id="lp-detail-drawer" aria-hidden="true">
      <button class="lpt-drawer-close" type="button">x</button>
      <div class="lpt-drawer-head"><h2 class="lpt-drawer-title">Detail</h2></div>
    </aside>
  </div>
</body>
</html>
