<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ring Classes</title>
</head>
<body>
<main class="app-shell" data-ag-system="ring-classes" data-ag-output="ring-classes">
    <header class="app-head">
      <div class="header-left">
        <h1 class="app-title" id="appTitle">Ring Classes</h1>
        <div class="app-meta" id="appSubtitle">Grouped by ring_name_normalized</div>
      </div>
      <div class="header-right">
        <div class="action-bar-mini" aria-label="Header actions">
          <button class="rs-button tap" type="button" id="printBtn">Print</button>
          <button class="rs-button tap" type="button" id="focusBtn" aria-pressed="false">Focus</button>
          <button class="rs-button tap" type="button" id="horseBtn" aria-pressed="false">Horse</button>
        </div>
      </div>
    </header>

    <section class="action-bar-bottom" aria-label="Horse filters" id="horseFilters" hidden></section>

    <section class="grid-frame">
      <div id="agBaseGrid" class="ag-theme-quartz"></div>
    </section>

    <nav class="action-anchors" aria-label="Ring anchors" id="ringAnchors"></nav>

    <footer class="status-line">
      <span><span id="rowCount">0</span> row(s) loaded</span>
      <span id="statusText">prototype only</span>
    </footer>
  </main>

  <section class="print-sheet" data-ag-output="ring-classes"></section>

<script>
  (function () {
    var assetVersion = window.RS_RING_CLASSES_ASSET_VERSION || "main";
    var cacheKey = "ring-classes-" + assetVersion;
    var assetBase = "https://cdn.jsdelivr.net/gh/sportdogfood/ringstatus@" + assetVersion + "/webflow/ring-classes";

    function addStyle(href) {
      var link = document.createElement("link");
      link.rel = "stylesheet";
      link.href = href;
      document.head.appendChild(link);
    }

    function addScript(src, onload) {
      var script = document.createElement("script");
      script.src = src;
      script.onload = onload || null;
      document.head.appendChild(script);
    }

    addStyle(assetBase + "/ring-classes.css?v=" + cacheKey);
    addScript("https://cdn.jsdelivr.net/npm/ag-grid-community@36.0.0/dist/ag-grid-community.min.js", function () {
      addScript(assetBase + "/ring-classes.js?v=" + cacheKey);
    });
  })();
</script>
</body>
</html>
