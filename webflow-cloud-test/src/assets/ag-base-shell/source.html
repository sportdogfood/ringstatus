<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AG Base Shell Proposed</title>
  <script src="https://cdn.jsdelivr.net/npm/ag-grid-community@36.0.0/dist/ag-grid-community.min.js"></script>
  <style>
    :root {
      --rs-bg: #0b0f14;
      --rs-surface: #ffffff;
      --rs-muted-surface: #ededed;
      --rs-text: #071426;
      --rs-muted: #64748b;
      --rs-border: var(--rs-muted-surface);
      --rs-accent: #005eb8;
      --rs-ok: #0f7a3c;
      --rs-danger: #111827;
      --rs-radius: 10px;
      --rs-gap: 0;
      --rs-shell-max: 800px;
      --rs-row-height: 42px;
      --rs-font: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    }

    html,
    body {
      height: 100%;
      margin: 0;
    }

    body {
      overflow: hidden;
      background: var(--rs-bg);
      font-family: var(--rs-font);
      color: var(--rs-text);
    }

    .app-shell {
      height: 100vh;
      min-height: 0;
      display: grid;
      grid-template-rows: auto auto auto 1fr auto auto;
      gap: 0;
      padding: var(--rs-gap);
      box-sizing: border-box;
    }

    .app-head,
    .action-bar,
    .action-anchors,
    .action-bar-bottom,
    .grid-frame,
    .status-line {
      width: 100%;
      max-width: var(--rs-shell-max);
      justify-self: center;
      box-sizing: border-box;
    }

    .app-head {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: start;
      column-gap: 12px;
      background: var(--rs-surface);
      /* border-radius: var(--rs-radius) var(--rs-radius) 0 0; */
      padding: 14px 16px 12px;
    }

    .header-left {
      min-width: 0;
    }

    .header-right {
      display: flex;
      justify-content: flex-end;
      min-width: 0;
    }

    .action-bar-mini {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 6px;
      max-width: 100%;
    }

    .app-title {
      margin: 0;
      font-size: 22px;
      line-height: 1.05;
      letter-spacing: 0;
    }

    .app-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 12px;
      margin-top: 6px;
      color: var(--rs-muted);
      font-size: 12px;
      line-height: 1.3;
    }

    .action-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      min-height: var(--rs-row-height);
      padding: 0 12px;
      background: var(--rs-muted-surface);
    }

    .action-bar-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      min-height: var(--rs-row-height);
      padding: 0 12px;
      background: var(--rs-muted-surface);
    }

    .action-anchors {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
      min-height: var(--rs-row-height);
      padding: 0 12px;
      background: var(--rs-surface);
      border-top: 1px solid var(--rs-border);
      border-bottom: 1px solid var(--rs-border);
    }

    .action-group {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      min-width: 0;
    }

    .rs-button {
      appearance: none;
      border: 1.5px solid #000;
      border-radius: 999px;
      background: var(--rs-surface);
      color: var(--rs-text);
      min-height: 30px;
      padding: 3px 12px;
      font-family: var(--rs-font);
      font-size: 12px;
      line-height: 1;
      text-transform: uppercase;
      letter-spacing: 0;
      cursor: pointer;
      white-space: nowrap;
      box-shadow: 0 1px 2px rgba(7, 20, 38, .14);
      transition: background-color .14s ease, color .14s ease, box-shadow .14s ease, transform .14s ease;
    }

    .rs-button:hover {
      box-shadow: 0 2px 5px rgba(7, 20, 38, .18);
      transform: translateY(-1px);
    }

    .tap-active {
      background: #000;
      color: #fff;
    }

    .tap-active-2 {
      background: var(--rs-ok);
      color: #fff;
      border-color: var(--rs-ok);
    }

    .rs-button:disabled {
      opacity: .45;
      cursor: not-allowed;
    }

    .grid-frame {
      min-height: 0;
      overflow: hidden;
      background: var(--rs-surface);
    }

    #agBaseGrid {
      height: 100%;
      min-height: 320px;
      width: 100%;
    }

    .status-line {
      min-height: var(--rs-row-height);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 0 16px 2px;
      color: #cbd5e1;
      font-size: 12px;
      line-height: 1.2;
    }

    .status-line strong {
      color: #fff;
    }

    .ag-theme-quartz {
      --ag-font-family: var(--rs-font);
      --ag-font-size: 13px;
      --ag-header-font-size: 13px;
      --ag-header-background-color: var(--rs-border);
      --ag-header-foreground-color: #071426;
      --ag-foreground-color: #071426;
      --ag-background-color: #fff;
      --ag-row-border-color: var(--rs-border);
      --ag-border-color: var(--rs-border);
      --ag-row-height: var(--rs-row-height);
      --ag-header-height: var(--rs-row-height);
      --ag-cell-horizontal-padding: 12px;
    }

    .ag-theme-quartz .ag-root-wrapper {
      border: 0;
      border-radius: 0;
    }

    .ag-theme-quartz .ag-header {
      border-top: 1px solid var(--rs-border);
      border-bottom: 1px solid var(--rs-border);
      background: var(--rs-border);
    }

    .ag-theme-quartz .ag-header-cell-menu-button,
    .ag-theme-quartz .ag-header-cell-filter-button,
    .ag-theme-quartz .ag-sort-indicator-container,
    .ag-theme-quartz .ag-header-icon {
      display: none;
    }

    .ag-theme-quartz .ag-row-hover {
      background-color: #f7f8fa;
    }

    @media (max-width: 479px) {
      .app-shell {
        padding: 0;
        gap: 0;
      }

      .app-head,
      .action-bar,
      .action-anchors,
      .action-bar-bottom,
      .grid-frame,
      .status-line {
        max-width: none;
        border-radius: 0;
      }

      .app-title {
        font-size: 20px;
      }

      .app-head {
        grid-template-columns: 1fr;
      }

      .header-right {
        grid-row: 1;
        justify-content: flex-end;
        padding-bottom: 0;
      }

      .header-left {
        grid-row: 2;
      }

      .action-bar,
      .action-bar-bottom {
        align-items: center;
      }

      .action-group.secondary {
        justify-content: flex-end;
      }

      .status-line {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 2px;
      }

    }

    @media print {
      @page {
        size: letter portrait;
        margin: .25in;
      }

      body {
        overflow: visible;
        background: #fff;
      }

      .app-shell {
        min-height: 10.5in;
        height: auto;
        display: grid;
        grid-template-rows: auto 1fr auto;
        padding: 0;
        background: #fff;
      }

      .action-bar,
      .action-bar-bottom,
      .action-anchors,
      .header-right {
        display: none;
      }

      .app-head {
        max-width: none;
        border-radius: 0;
        padding: 0 0 6px;
        border-bottom: 1px solid #000;
      }

      .app-title {
        font-size: 14px;
        line-height: 1.1;
      }

      .app-meta {
        margin-top: 2px;
        font-size: 9px;
        line-height: 1.1;
      }

      .grid-frame {
        max-width: none;
        border: 0;
        overflow: visible;
      }

      #agBaseGrid {
        height: auto;
        min-height: 0;
      }

      .ag-theme-quartz {
        --ag-font-size: 8px;
        --ag-header-font-size: 8px;
        --ag-row-height: 18px;
        --ag-header-height: 18px;
        --ag-cell-horizontal-padding: 4px;
      }

      .status-line {
        display: flex;
        min-height: 18px;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 4px 0 0;
        color: #000;
        font-size: 8px;
        line-height: 1.1;
        border-top: 1px solid #000;
      }
    }
  </style>
</head>
<body>
  <main class="app-shell" data-ag-system="ag_base_shell" data-contract="docs/horseshowing/ag-output-system-contract.md">
    <header class="app-head">
      <div class="header-left">
        <h1 class="app-title">AG Base Shell</h1>
        <div class="app-meta">
          <span>Reference shell for mobile, mobile-pro, print, lists, and forms</span>
        </div>
      </div>
      <div class="header-right">
        <div class="action-bar-mini" aria-label="Header actions">
          <button class="rs-button tap" type="button" id="miniOneBtn">One</button>
          <button class="rs-button tap" type="button" id="miniTwoBtn">Two</button>
          <button class="rs-button tap" type="button" id="miniThreeBtn">Three</button>
        </div>
      </div>
    </header>

    <section class="action-bar" aria-label="Grid actions">
      <div class="action-group">
        <button class="rs-button tap tap-active" type="button" id="printBtn">Print</button>
        <button class="rs-button tap" type="button" id="hideBtn">Hide</button>
        <button class="rs-button tap tap-active" type="button" id="diffBtn">Diff</button>
      </div>
      <div class="action-group secondary">
        <button class="rs-button tap" type="button" id="inputBtn">Input</button>
        <button class="rs-button tap tap-active-2" type="button" id="submitBtn">Submit</button>
      </div>
    </section>

    <nav class="action-anchors" aria-label="Anchors">
      <button class="rs-button tap" type="button">Ring</button>
      <button class="rs-button tap" type="button">Class</button>
      <button class="rs-button tap" type="button">Entry</button>
      <button class="rs-button tap" type="button">Results</button>
    </nav>

    <section class="grid-frame">
      <div id="agBaseGrid" class="ag-theme-quartz"></div>
    </section>

    <section class="action-bar-bottom" aria-label="Bottom actions">
      <div class="action-group">
        <button class="rs-button tap" type="button" id="bottomBackBtn">Back</button>
        <button class="rs-button tap" type="button" id="bottomClearBtn">Clear</button>
      </div>
      <div class="action-group secondary">
        <button class="rs-button tap tap-active-2" type="button" id="bottomSaveBtn">Save</button>
      </div>
    </section>

    <footer class="status-line">
      <span><strong id="rowCount">0</strong> row(s) loaded</span>
      <span id="statusText">base_grid_options + print_options + hide + diff + input hooks</span>
    </footer>
  </main>

  <script>
    const sampleRows = [
      {
        id: "14910|20260708|4432|711|31220|1401",
        time: "8:30 AM",
        ring: "INDOOR 1",
        no: 173,
        class_name: "1.05m Junior Classic II.2b",
        status: "soon",
        starts_in: 42,
        changed: false
      },
      {
        id: "14910|20260708|4438|715|31384|1552",
        time: "10:00 AM",
        ring: "INDOOR 5",
        no: 201,
        class_name: "Junior Hunter 3'6",
        status: "now",
        starts_in: 88,
        changed: true
      },
      {
        id: "14910|20260708|4441|721|31888|1780",
        time: "11:15 AM",
        ring: "GRAND",
        no: 220,
        class_name: "Yeti Grand Prix 1.45m II.2a American Std",
        status: "soon",
        starts_in: 136,
        changed: false
      },
      {
        id: "14910|20260708|4444|726|32111|1840",
        time: "12:45 PM",
        ring: "ANNEX",
        no: 314,
        class_name: "NAL/WIHS Adult Jumper Classic",
        status: "done",
        starts_in: 228,
        changed: true
      }
    ];

    let hideDone = false;
    let showDiff = true;
    let gridApi = null;

    function statusRenderer(params) {
      const value = String(params.value || "soon").toLowerCase();
      const variant = value === "done" ? "tap-active-2" : value === "now" ? "tap-active" : "";
      return `<button class="rs-button tap ${variant}" type="button">${value}</button>`;
    }

    function visibleRows() {
      if (!hideDone) return sampleRows;
      return sampleRows.filter((row) => row.status !== "done");
    }

    function updateRows() {
      if (!gridApi) return;
      gridApi.setGridOption("rowData", visibleRows());
      document.getElementById("rowCount").textContent = String(visibleRows().length);
    }

    const columnDefs = [
      { headerName: "TIME", field: "time", minWidth: 78, width: 88, filter: "agTextColumnFilter" },
      { headerName: "RING", field: "ring", minWidth: 78, width: 88, filter: "agTextColumnFilter" },
      { headerName: "NO", field: "no", minWidth: 56, width: 60, filter: "agNumberColumnFilter" },
      {
        headerName: "CLASS",
        field: "class_name",
        minWidth: 170,
        flex: 1,
        filter: "agTextColumnFilter"
      },
      { headerName: "IN", field: "starts_in", minWidth: 56, width: 60, filter: "agNumberColumnFilter", valueFormatter: (params) => `${params.value}m` },
      { headerName: "STATUS", field: "status", minWidth: 88, width: 88, cellRenderer: statusRenderer }
    ];

    const gridOptions = {
      rowData: sampleRows,
      columnDefs,
      defaultColDef: {
        sortable: true,
        filter: true,
        resizable: false,
        suppressHeaderMenuButton: true
      },
      getRowId: (params) => params.data.id,
      rowSelection: { mode: "singleRow", checkboxes: false, enableClickSelection: true },
      animateRows: false,
      ensureDomOrder: true,
      suppressMovableColumns: true,
      suppressCellFocus: true,
      suppressHeaderFocus: true,
      onGridReady: (event) => {
        gridApi = event.api;
        updateRows();
      }
    };

    const gridDiv = document.getElementById("agBaseGrid");
    if (window.agGrid && typeof window.agGrid.createGrid === "function") {
      window.agGrid.createGrid(gridDiv, gridOptions);
    } else {
      gridDiv.innerHTML = "<table><tr><th>TIME</th><th>RING</th><th>CLASS</th></tr></table>";
    }

    document.getElementById("printBtn").addEventListener("click", () => window.print());
    document.getElementById("hideBtn").addEventListener("click", (event) => {
      hideDone = !hideDone;
      event.currentTarget.textContent = hideDone ? "Show" : "Hide";
      event.currentTarget.classList.toggle("tap-active", hideDone);
      updateRows();
    });
    document.getElementById("diffBtn").addEventListener("click", (event) => {
      showDiff = !showDiff;
      event.currentTarget.textContent = "Diff";
      event.currentTarget.classList.toggle("tap-active", showDiff);
      gridApi && gridApi.refreshCells({ force: true });
    });
    document.getElementById("inputBtn").addEventListener("click", () => {
      document.getElementById("statusText").textContent = "input hook: future Airtable/API/trigger lane";
    });
    document.getElementById("submitBtn").addEventListener("click", () => {
      document.getElementById("statusText").textContent = "submit hook: no write in this local base shell";
    });
  </script>
</body>
</html>
