<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Barn Entry Review</title>
  <script src="https://cdn.jsdelivr.net/npm/ag-grid-community@36.0.0/dist/ag-grid-community.min.js"></script>
<style>
    :root {
      --rs-bg: #0b0f14;
      --rs-surface: #ffffff;
      --rs-muted-surface: #ededed;
      --rs-text: #071426;
      --rs-muted: #64748b;
      --rs-border: var(--rs-muted-surface);
      --rs-accent: #005eb8;
      --rs-ok: #0f7a3c;
      --rs-danger: #111827;
      --rs-radius: 10px;
      --rs-gap: 0;
      --rs-shell-max: 800px;
      --rs-row-height: 42px;
      --rs-font: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    }

    html,
    body {
      height: 100%;
      margin: 0;
    }

    body {
      overflow: hidden;
      background: var(--rs-bg);
      font-family: var(--rs-font);
      color: var(--rs-text);
    }

    .app-shell {
      height: 100vh;
      min-height: 0;
      display: grid;
      grid-template-rows: auto auto auto 1fr auto auto;
      gap: 0;
      padding: var(--rs-gap);
      box-sizing: border-box;
    }

    .app-head,
    .action-bar,
    .action-anchors,
    .action-bar-bottom,
    .grid-frame,
    .status-line {
      width: 100%;
      max-width: var(--rs-shell-max);
      justify-self: center;
      box-sizing: border-box;
    }

    .app-head {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: start;
      column-gap: 12px;
      background: var(--rs-surface);
      /* border-radius: var(--rs-radius) var(--rs-radius) 0 0; */
      padding: 14px 16px 12px;
    }

    .header-left {
      min-width: 0;
    }

    .header-right {
      display: flex;
      justify-content: flex-end;
      min-width: 0;
    }

    .action-bar-mini {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 6px;
      max-width: 100%;
    }

    .app-title {
      margin: 0;
      font-size: 22px;
      line-height: 1.05;
      letter-spacing: 0;
    }

    .app-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 12px;
      margin-top: 6px;
      color: var(--rs-muted);
      font-size: 12px;
      line-height: 1.3;
    }

    .action-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      min-height: var(--rs-row-height);
      padding: 0 12px;
      background: var(--rs-muted-surface);
    }

    .action-bar-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      min-height: var(--rs-row-height);
      padding: 0 12px;
      background: var(--rs-muted-surface);
    }

    .action-anchors {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
      min-height: var(--rs-row-height);
      padding: 0 12px;
      background: var(--rs-surface);
      border-top: 1px solid var(--rs-border);
      border-bottom: 1px solid var(--rs-border);
    }

    .action-group {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      min-width: 0;
    }

    .rs-button {
      appearance: none;
      border: 1.5px solid #000;
      border-radius: 999px;
      background: var(--rs-surface);
      color: var(--rs-text);
      min-height: 30px;
      padding: 3px 12px;
      font-family: var(--rs-font);
      font-size: 12px;
      line-height: 1;
      text-transform: uppercase;
      letter-spacing: 0;
      cursor: pointer;
      white-space: nowrap;
      box-shadow: 0 1px 2px rgba(7, 20, 38, .14);
      transition: background-color .14s ease, color .14s ease, box-shadow .14s ease, transform .14s ease;
    }

    .rs-button:hover {
      box-shadow: 0 2px 5px rgba(7, 20, 38, .18);
      transform: translateY(-1px);
    }

    .tap-active {
      background: #000;
      color: #fff;
    }

    .tap-active-2 {
      background: var(--rs-ok);
      color: #fff;
      border-color: var(--rs-ok);
    }

    .rs-button:disabled {
      opacity: .45;
      cursor: not-allowed;
    }

    .grid-frame {
      min-height: 0;
      overflow: hidden;
      background: var(--rs-surface);
    }

    #agBaseGrid {
      height: 100%;
      min-height: 320px;
      width: 100%;
    }

    .status-line {
      min-height: var(--rs-row-height);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 0 16px 2px;
      color: #cbd5e1;
      font-size: 12px;
      line-height: 1.2;
    }

    .status-line strong {
      color: #fff;
    }

    .ag-theme-quartz {
      --ag-font-family: var(--rs-font);
      --ag-font-size: 13px;
      --ag-header-font-size: 13px;
      --ag-header-background-color: var(--rs-border);
      --ag-header-foreground-color: #071426;
      --ag-foreground-color: #071426;
      --ag-background-color: #fff;
      --ag-row-border-color: var(--rs-border);
      --ag-border-color: var(--rs-border);
      --ag-row-height: var(--rs-row-height);
      --ag-header-height: var(--rs-row-height);
      --ag-cell-horizontal-padding: 12px;
    }

    .ag-theme-quartz .ag-root-wrapper {
      border: 0;
      border-radius: 0;
    }

    .ag-theme-quartz .ag-header {
      border-top: 1px solid var(--rs-border);
      border-bottom: 1px solid var(--rs-border);
      background: var(--rs-border);
    }

    .ag-theme-quartz .ag-header-cell-menu-button,
    .ag-theme-quartz .ag-header-cell-filter-button,
    .ag-theme-quartz .ag-sort-indicator-container,
    .ag-theme-quartz .ag-header-icon {
      display: none;
    }

    .ag-theme-quartz .ag-row-hover {
      background-color: #f7f8fa;
    }

    @media (max-width: 479px) {
      .app-shell {
        padding: 0;
        gap: 0;
      }

      .app-head,
      .action-bar,
      .action-anchors,
      .action-bar-bottom,
      .grid-frame,
      .status-line {
        max-width: none;
        border-radius: 0;
      }

      .app-title {
        font-size: 20px;
      }

      .app-head {
        grid-template-columns: 1fr;
      }

      .header-right {
        grid-row: 1;
        justify-content: flex-end;
        padding-bottom: 0;
      }

      .header-left {
        grid-row: 2;
      }

      .action-bar,
      .action-bar-bottom {
        align-items: center;
      }

      .action-group.secondary {
        justify-content: flex-end;
      }

      .status-line {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 2px;
      }

    }

    @media print {
      @page {
        size: letter portrait;
        margin: .25in;
      }

      body {
        overflow: visible;
        background: #fff;
      }

      .app-shell {
        min-height: 10.5in;
        height: auto;
        display: grid;
        grid-template-rows: auto 1fr auto;
        padding: 0;
        background: #fff;
      }

      .action-bar,
      .action-bar-bottom,
      .action-anchors,
      .header-right {
        display: none;
      }

      .app-head {
        max-width: none;
        border-radius: 0;
        padding: 0 0 6px;
        border-bottom: 1px solid #000;
      }

      .app-title {
        font-size: 14px;
        line-height: 1.1;
      }

      .app-meta {
        margin-top: 2px;
        font-size: 9px;
        line-height: 1.1;
      }

      .grid-frame {
        max-width: none;
        border: 0;
        overflow: visible;
      }

      #agBaseGrid {
        height: auto;
        min-height: 0;
      }

      .ag-theme-quartz {
        --ag-font-size: 8px;
        --ag-header-font-size: 8px;
        --ag-row-height: 18px;
        --ag-header-height: 18px;
        --ag-cell-horizontal-padding: 4px;
      }

      .status-line {
        display: flex;
        min-height: 18px;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 4px 0 0;
        color: #000;
        font-size: 8px;
        line-height: 1.1;
        border-top: 1px solid #000;
      }
    }
  </style>
  <style data-barn-entry-options>
    .is-hidden { display: none !important; }
    .app-shell.is-edit-mode { background: var(--rs-muted-surface); }
    .ag-theme-quartz .ag-row.row-pending,
    .ag-theme-quartz .ag-row.row-tap3 { outline: 0; }
    .ag-theme-quartz .ag-row.row-confirmed { outline: 2px solid var(--rs-ok); outline-offset: -2px; }
    .ag-theme-quartz .ag-row.row-declined { outline: 2px solid #000; outline-offset: -2px; }
    .flyup[hidden], .review-panel[hidden], .selected-chip[hidden] { display: none; }
    .flyup { position: fixed; inset: 0; z-index: 50; display: flex; align-items: flex-end; justify-content: center; background: rgba(0,0,0,.46); padding: 8px; box-sizing: border-box; }
    .flyup-card { width: min(100%, var(--rs-shell-max)); height: 75vh; display: grid; grid-template-rows: auto 1fr auto; background: var(--rs-surface); border: 2px solid #000; overflow: hidden; }
    .flyup-head, .flyup-actions { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px; }
    .flyup-actions { border-top: 1px solid var(--rs-border); }
    .add-body { display: grid; align-content: start; gap: 12px; padding: 10px; overflow: auto; }
    .field { display: grid; gap: 4px; }
    .field-label { color: var(--rs-muted); font-size: 11px; font-weight: 700; text-transform: uppercase; }
    .field input { min-height: 38px; border: 1px solid var(--rs-border); padding: 8px 10px; font: inherit; font-size: 16px; }
    .selected-chip { min-height: 38px; display: flex; align-items: center; justify-content: space-between; border: 1px solid var(--rs-border); padding: 6px 8px; font-weight: 700; }
    .suggestions { display: grid; max-height: 210px; overflow: auto; border: 1px solid var(--rs-border); }
    .suggestions:empty { display: none; }
    .suggestion { width: 100%; min-height: 42px; border: 0; border-bottom: 1px solid var(--rs-border); border-radius: 0; background: #fff; padding: 6px 10px; text-align: left; }
    .review-panel { position: fixed; inset: 0; z-index: 40; overflow: auto; background: #fff; padding: 16px; }
    .review-actions { display: flex; gap: 6px; justify-content: flex-end; }
    .review-table { width: 100%; border-collapse: collapse; }
    .review-table th, .review-table td { border-bottom: 1px solid var(--rs-border); padding: 8px; text-align: left; }
    .print-sheet { display: none; }
    @media print {
      .app-shell, .flyup, .review-panel { display: none !important; }
      .print-sheet { display: block; font-family: Arial, Helvetica, sans-serif; color: #111; }
      .print-title { display: flex; justify-content: space-between; align-items: end; border-bottom: 1px solid #222; margin-bottom: 5px; padding-bottom: 4px; }
      .print-title h1 { margin: 0; font-size: 14px; }
      .print-title p { margin: 0; font-size: 8px; text-align: right; }
      .print-columns { columns: 3 250px; column-gap: 12px; }
      .print-ring-group { break-inside: avoid; margin-bottom: 6px; }
      .print-ring { border-bottom: 1px solid #333; font-size: 11px; font-weight: 800; }
      .print-row { display: grid; grid-template-columns: 46px minmax(0,1fr); gap: 5px; min-height: 14px; border-bottom: 1px solid #e7e7e7; padding: 1px 2px; font-size: 8px; break-inside: avoid; }
      .print-horse { grid-column: 1 / -1; font-weight: 700; text-transform: uppercase; }
    }
  </style>
</head>
<body>
  <main class="app-shell" id="appShell" data-ag-system="ag_base_shell" data-contract="docs/horseshowing/ag-output-system-contract.md">
    <header class="app-head" id="formPanel">
      <div class="header-left">
        <h1 class="app-title">Barn Entry Review</h1>
        <div class="app-meta"><span id="focusDateText">Loading focus day...</span></div>
      </div>
      <div class="header-right">
        <div class="action-bar-mini" aria-label="Header actions">
          <button class="rs-button tap" type="button" id="miniEditBtn">EDIT</button>
          <button class="rs-button tap" type="button" id="miniPrintBtn">PRINT</button>
          <button class="rs-button tap is-hidden" type="button" id="miniUnusedBtn">UNUSED</button>
        </div>
      </div>
    </header>
    <section class="action-bar is-hidden" aria-label="Grid actions"></section>
    <nav class="action-anchors is-hidden" aria-label="Anchors"></nav>
    <section class="grid-frame" id="gridPanel"><div id="agBaseGrid" class="ag-theme-quartz"></div></section>
    <section class="action-bar-bottom" id="bottomSubmit" aria-label="Bottom actions">
      <div class="action-group">
        <button class="rs-button tap" type="button" id="bottomEditBtn">EDIT</button>
        <button class="rs-button tap is-hidden" type="button" id="bottomAddBtn">ADD</button>
      </div>
      <div class="action-group secondary">
        <button class="rs-button tap tap-active-2 is-hidden" type="button" id="bottomSendBtn">SEND</button>
      </div>
    </section>
    <footer class="status-line">
      <span><strong id="rowCount">0</strong> row(s) loaded</span>
      <span id="statusText">Loading mapped entries...</span>
    </footer>
  </main>

  <section class="flyup" id="addPanel" hidden>
    <div class="flyup-card">
      <div class="flyup-head"><strong>Add Entry</strong><button class="rs-button tap" id="cancelAddBtn" type="button">CLOSE</button></div>
      <div class="add-body">
        <label class="field"><span class="field-label">Horse</span><span id="selectedHorseChip" class="selected-chip" hidden><span id="selectedHorseText"></span><button class="rs-button tap" id="clearHorseBtn" type="button">X</button></span><input id="horseInput" type="search" autocomplete="off" placeholder="Search horse"><span id="horseSuggestions" class="suggestions"></span></label>
        <label class="field"><span class="field-label">Class</span><span id="selectedClassChip" class="selected-chip" hidden><span id="selectedClassText"></span><button class="rs-button tap" id="clearClassBtn" type="button">X</button></span><input id="classInput" type="search" autocomplete="off" placeholder="Search class"><span id="classSuggestions" class="suggestions"></span></label>
      </div>
      <div class="flyup-actions"><button class="rs-button tap tap-active-2" id="confirmAddBtn" type="button">SAVE</button></div>
    </div>
  </section>
  <datalist id="classOptions"></datalist><datalist id="horseOptions"></datalist>
  <section class="review-panel" id="reviewPanel" hidden>
    <div class="review-actions"><button class="rs-button tap" id="reviewPrintBtn" type="button">PRINT</button><button class="rs-button tap tap-active-2" id="shareBtn" type="button">SHARE</button></div>
    <div id="reviewCopy"></div>
  </section>
  <div id="printSheet" class="print-sheet"></div>

<script>
    (() => {
      const API_BASE = "https://horseshowing-700800454.development.catalystserverless.com/server/horseshowing_sync/";
      const SUBMIT_URL = "https://ringstatus.com/test/barn-entry";
      const params = new URLSearchParams(location.search);
      const DEFAULT_SHOW_NO = params.get("show_no") || "14909";
      const DEFAULT_FOCUS_DAY = params.get("focus_day") || "2026-07-05";
      const TRAINER_FILTER = params.get("trainer") || "";

      const state = {
        schedulePayload: null,
        classRows: [],
        sourceRows: [],
        scopedRows: [],
        helperHorseRows: [],
        rows: [],
        editMode: false,
        draftClassText: "",
        draftHorseText: "",
        draftClass: null,
        draftHorse: null,
        selectedClass: null,
        selectedHorse: null,
        gridApi: null
      };

      const els = {
        appShell: document.getElementById("appShell"),
        focusDateText: document.getElementById("focusDateText"),
        mainStatus: document.getElementById("statusText"),
        rowCount: document.getElementById("rowCount"),
        formPanel: document.getElementById("formPanel"),
        addPanel: document.getElementById("addPanel"),
        gridPanel: document.getElementById("gridPanel"),
        reviewPanel: document.getElementById("reviewPanel"),
        reviewCopy: document.getElementById("reviewCopy"),
        entryGrid: document.getElementById("agBaseGrid"),
        miniEditBtn: document.getElementById("miniEditBtn"),
        editBtn: document.getElementById("bottomEditBtn"),
        openAddBtn: document.getElementById("bottomAddBtn"),
        printBtn: document.getElementById("miniPrintBtn"),
        submitBtn: document.getElementById("bottomSendBtn"),
        bottomSubmit: document.getElementById("bottomSubmit"),
        classOptions: document.getElementById("classOptions"),
        horseOptions: document.getElementById("horseOptions"),
        classInput: document.getElementById("classInput"),
        classSuggestions: document.getElementById("classSuggestions"),
        selectedClassChip: document.getElementById("selectedClassChip"),
        selectedClassText: document.getElementById("selectedClassText"),
        clearClassBtn: document.getElementById("clearClassBtn"),
        horseInput: document.getElementById("horseInput"),
        horseSuggestions: document.getElementById("horseSuggestions"),
        selectedHorseChip: document.getElementById("selectedHorseChip"),
        selectedHorseText: document.getElementById("selectedHorseText"),
        clearHorseBtn: document.getElementById("clearHorseBtn"),
        cancelAddBtn: document.getElementById("cancelAddBtn"),
        confirmAddBtn: document.getElementById("confirmAddBtn"),
        reviewPrintBtn: document.getElementById("reviewPrintBtn"),
        shareBtn: document.getElementById("shareBtn"),
        printSheet: document.getElementById("printSheet")
      };

      function escapeHtml(value) {
        return String(value ?? "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      function normalize(value) {
        return String(value || "").toLowerCase().replace(/[^a-z0-9']+/g, " ").trim();
      }

      function compactTime(value) {
        return normalize(value).replace(/\b(am|pm)\b/g, "").replace(/\s+/g, "");
      }

      function status(message, cls = "") {
        els.mainStatus.dataset.state = cls;
        els.mainStatus.textContent = message || "";
      }

      function debounce(fn, wait = 120) {
        let timer = null;
        return (...args) => {
          clearTimeout(timer);
          timer = setTimeout(() => fn(...args), wait);
        };
      }

      function focusDay() {
        return state.schedulePayload?.show_focus_date || state.schedulePayload?.focus_day || DEFAULT_FOCUS_DAY;
      }

      function displayTime(row) {
        return row.display_time || row.class_start_time || row.time_text || "";
      }

      function className(row) {
        return row.class_name || row.class_label || "";
      }

      function ringName(row) {
        return row.ring_name_normalized || row.ring_display || row.ring_name || "";
      }

      function sourceHorseName(row) {
        const parts = String(row.source_payload || "").split("|").map((part) => part.trim());
        const candidate = row.barn_name || parts[2] || row.horse_name || row.horse || "";
        if (normalize(candidate) === normalize(row.rider)) return "";
        return candidate;
      }

      function horseName(row) {
        return row.barn_name || sourceHorseName(row) || "UNRESOLVED HORSE";
      }

      function classSearchText(row) {
        return normalize([
          compactTime(displayTime(row)),
          displayTime(row),
          ringName(row),
          row.class_no,
          row.class_number,
          className(row)
        ].join(" "));
      }

      function horseSearchText(row) {
        return normalize([
          row.barn_name,
          row.show_name,
          row.horse_display,
          row.horse_name,
          row.horse,
          row.horse_aka,
          row.aka
        ].join(" "));
      }

      function trainerText(row) {
        return normalize([
          row.trainer,
          row.trainer_name,
          row.coach_name,
          row.tenant_name
        ].join(" "));
      }

      function rowMatchesTrainer(row) {
        if (!TRAINER_FILTER) return true;
        const source = trainerText(row);
        const target = normalize(TRAINER_FILTER);
        return source.includes(target) || target.includes(source);
      }

      function rowKey(row) {
        return row.review_key || row.entry_const_key || row.entry_go_key || [
          row.show_no || DEFAULT_SHOW_NO,
          row.focus_day || focusDay(),
          row.class_no || row.class_number,
          row.entry_no || "",
          horseName(row)
        ].join("|");
      }

      function compareRows(a, b) {
        const time = String(displayTime(a)).localeCompare(String(displayTime(b)));
        if (time) return time;
        const ring = String(ringName(a)).localeCompare(String(ringName(b)));
        if (ring) return ring;
        return String(className(a)).localeCompare(String(className(b)));
      }

      async function fetchJson(url) {
        const response = await fetch(url);
        const data = await response.json();
        if (!response.ok || data.ok !== true) throw new Error(data.error || data.blocker || `HTTP ${response.status}`);
        return data;
      }

      async function loadSchedule() {
        const url = new URL(API_BASE);
        url.searchParams.set("action", "wec-mobile-live");
        url.searchParams.set("show_no", DEFAULT_SHOW_NO);
        url.searchParams.set("focus_day", DEFAULT_FOCUS_DAY);
        const data = await fetchJson(url);
        state.schedulePayload = data;
        state.classRows = [];
        for (const ring of data.rings || []) {
          for (const klass of ring.classes || []) {
            state.classRows.push({
              ...klass,
              show_no: data.show_no || DEFAULT_SHOW_NO,
              focus_day: data.show_focus_date || data.focus_day || DEFAULT_FOCUS_DAY,
              focus_show_record_id: data.focus_show_record_id || "",
              ring_no: ring.ring_no || klass.ring_no || "",
              ring_day_no: klass.ring_day_no || "",
              ring_name_normalized: ring.ring_name_normalized || klass.ring_name_normalized || "",
              ring_display: ring.ring_display || ring.ring_name_normalized || ""
            });
          }
        }
      }

      async function fetchClassOogRows() {
        const rows = [];
        for (let offset = 0; offset < 1000; offset += 200) {
          const url = new URL(API_BASE);
          url.searchParams.set("action", "export-mirror-table");
          url.searchParams.set("show_no", DEFAULT_SHOW_NO);
          url.searchParams.set("table", "class_oog");
          url.searchParams.set("limit", "200");
          url.searchParams.set("offset", String(offset));
          const data = await fetchJson(url);
          rows.push(...(data.data || []).filter((row) => String(row.focus_day || "") === focusDay()));
          if (!data.has_more) break;
        }
        return rows;
      }

      async function fetchHorseHelpers(query = "") {
        const url = new URL(API_BASE);
        url.searchParams.set("action", "wec-helper-search");
        url.searchParams.set("type", "horses");
        url.searchParams.set("q", query || "a");
        url.searchParams.set("limit", "200");
        url.searchParams.set("search_mode", "catalyst");
        url.searchParams.set("fallback_scan", "1");
        const data = await fetchJson(url);
        return (data.top_matches || data.results || data.matches || []).map((match) => {
          const fields = match.fields || {};
          return {
            barn_name: fields.barn_name || match.barn_name || match.display_name || match.matched_value || "",
            show_name: fields.show_name || fields.horse_display || fields.horse_name || fields.horse || "",
            horse_name: fields.horse_name || fields.horse || "",
            horse_aka: fields.horse_aka || fields.aka || "",
            horse_key: fields.horse_key || match.helper_key || "",
            follow: fields.follow,
            active: fields.active,
            source: "helper_roster"
          };
        }).filter((row) => row.barn_name);
      }

      function canonicalHorseForEntry(row) {
        const aliases = [sourceHorseName(row), row.barn_name, row.horse_name, row.horse, row.horse_display, row.show_name]
          .map(normalize)
          .filter(Boolean);
        return state.helperHorseRows.find((candidate) => {
          const search = horseSearchText(candidate);
          return aliases.some((alias) => search.includes(alias) || alias.includes(normalize(candidate.barn_name)));
        }) || null;
      }

      function classForEntry(row) {
        return state.classRows.find((klass) => String(klass.class_no || "") === String(row.class_no || "")) || {};
      }

      function reviewRowFromEntry(row) {
        const klass = classForEntry(row);
        const canonicalHorse = canonicalHorseForEntry(row);
        return {
          review_key: rowKey(row),
          source: "mapped",
          status: "pending",
          show_no: row.show_no || DEFAULT_SHOW_NO,
          focus_day: row.focus_day || focusDay(),
          focus_show_record_id: state.schedulePayload?.focus_show_record_id || "",
          ring_day_no: row.ring_day_no || klass.ring_day_no || "",
          ring_no: row.ring_no || klass.ring_no || "",
          ring_name_normalized: row.ring_name_normalized || klass.ring_name_normalized || "",
          class_no: row.class_no || klass.class_no || "",
          class_number: row.class_number || klass.class_number || "",
          class_name: row.class_name || klass.class_name || "",
          class_start_time: row.class_start_time || klass.class_start_time || "",
          display_time: row.display_time || klass.display_time || klass.time_text || "",
          entry_no: row.entry_no || "",
          barn_name: canonicalHorse?.barn_name || sourceHorseName(row) || "UNRESOLVED HORSE",
          horse_name: row.horse_name || row.horse || canonicalHorse?.horse_name || "",
          horse_key: row.horse_key || canonicalHorse?.horse_key || "",
          matched_source_row: row.ROWID || row.rec_id || ""
        };
      }

      function dedupeRows(rows) {
        const map = new Map();
        for (const row of rows) {
          const key = row.review_key;
          if (!key || map.has(key)) continue;
          map.set(key, row);
        }
        return [...map.values()].sort(compareRows);
      }

      function statusRenderer(params) {
        const value = params.value || "pending";
        return `<button class="status-toggle ${escapeHtml(value)}" type="button" data-status-key="${escapeHtml(params.data.review_key)}">${escapeHtml(value)}</button>`;
      }

      function classFormDescription(row) {
        return [
          displayTime(row),
          ringName(row).toUpperCase(),
          row.class_number || row.class_no || "",
          className(row)
        ].filter(Boolean).join(" | ");
      }

      function entryTopLine(row) {
        return [
          displayTime(row),
          ringName(row).toUpperCase(),
          row.class_number || row.class_no || ""
        ].filter(Boolean).join(" | ");
      }

      function statusLabel(value, mode = "long") {
        if (value === "confirmed") return mode === "short" ? "ok" : "confirmed";
        if (value === "declined") return mode === "short" ? "no" : "declined";
        return mode === "short" ? "tap" : "pending";
      }

      function textRenderer(value) {
        return escapeHtml(value ?? "");
      }

      function gridColumnDefs() {
        return [
          { headerName: "TIME", valueGetter: (params) => displayTime(params.data || {}), width: 88, minWidth: 78 },
          { headerName: "RING", valueGetter: (params) => ringName(params.data || {}).toUpperCase(), width: 88, minWidth: 78 },
          { headerName: "CLASS", valueGetter: (params) => [params.data?.class_number || params.data?.class_no, className(params.data || {})].filter(Boolean).join(" - "), flex: 1, minWidth: 170 },
          { headerName: "HORSE", field: "barn_name", width: 140, minWidth: 120 }
        ];
      }

      function ensureAgGridLoaded() {
        if (window.agGrid?.createGrid) return Promise.resolve();
        return new Promise((resolve, reject) => {
          const existing = document.querySelector('script[data-rs-ag-grid="1"]');
          if (existing) {
            existing.addEventListener("load", resolve, { once: true });
            existing.addEventListener("error", reject, { once: true });
            return;
          }
          const script = document.createElement("script");
          script.src = "https://cdn.jsdelivr.net/npm/ag-grid-community@36.0.0/dist/ag-grid-community.min.js";
          script.async = true;
          script.dataset.rsAgGrid = "1";
          script.onload = resolve;
          script.onerror = () => reject(new Error("AG Grid failed to load."));
          document.head.appendChild(script);
        });
      }

      function initGrid() {
        if (!window.agGrid || typeof window.agGrid.createGrid !== "function") {
          els.entryGrid.innerHTML = "AG Grid failed to load.";
          return;
        }
        state.gridApi = window.agGrid.createGrid(els.entryGrid, {
          theme: window.agGrid.themeQuartz || undefined,
          columnDefs: gridColumnDefs(),
          rowData: [],
          getRowId: (params) => params.data.review_key,
          overlayLoadingTemplate: `<span class="loading-copy">Loading entries...</span>`,
          overlayNoRowsTemplate: `<span class="loading-copy">No rows</span>`,
          defaultColDef: {
            sortable: true,
            filter: false,
            resizable: true,
            editable: false,
            suppressSizeToFit: true,
            suppressHeaderMenuButton: true
          },
          rowSelection: { mode: "singleRow", checkboxes: false, enableClickSelection: true },
          animateRows: false,
          suppressCellFocus: true,
          rowClassRules: {
            "row-pending": (params) => (params.data?.status || "pending") === "pending",
            "row-confirmed": (params) => params.data?.status === "confirmed",
            "row-declined": (params) => params.data?.status === "declined"
          }
        });
        els.entryGrid.addEventListener("click", (event) => {
          const row = event.target.closest(".ag-row[row-id]");
          if (row) toggleStatus(row.getAttribute("row-id"));
        });
        els.entryGrid.addEventListener("keydown", (event) => {
          if (event.key !== "Enter" && event.key !== " ") return;
          const row = event.target.closest(".ag-row[row-id]");
          if (row) toggleStatus(row.getAttribute("row-id"));
        });
      }

      function setGridRows() {
        if (!state.gridApi) return;
        const rows = state.rows.map((row) => ({ ...row }));
        state.gridApi.setGridOption("rowData", rows);
        els.rowCount.textContent = String(rows.length);
      }

      function toggleStatus(key) {
        if (!state.editMode) return;
        if (key === "__add__") return;
        const order = ["pending", "confirmed", "declined"];
        const index = state.rows.findIndex((row) => row.review_key === key);
        if (index < 0) return;
        const current = state.rows[index];
        const next = order[(order.indexOf(current.status || "pending") + 1) % order.length];
        const updated = { ...current, status: next };
        state.rows[index] = updated;
        const rowNode = state.gridApi?.getRowNode(key);
        if (rowNode) {
          rowNode.setData(updated);
          state.gridApi.redrawRows({ rowNodes: [rowNode] });
        }
      }

      function toggleEditMode() {
        state.editMode = !state.editMode;
        for (const button of [els.editBtn, els.miniEditBtn]) {
          button.classList.toggle("tap-active", state.editMode);
          button.textContent = state.editMode ? "DONE" : "EDIT";
        }
        els.openAddBtn.classList.toggle("is-hidden", !state.editMode);
        els.submitBtn.classList.toggle("is-hidden", !state.editMode);
        els.appShell.classList.toggle("is-edit-mode", state.editMode);
        setShellMode(state.editMode ? "edit" : "default");
        if (!state.editMode) resetDraft();
        setGridRows();
      }

      function setShellMode(mode) {
        els.appShell.classList.remove("mode-default", "mode-edit", "mode-print");
        els.appShell.classList.add(`mode-${mode}`);
      }

      function resetDraft() {
        state.draftClassText = "";
        state.draftHorseText = "";
        state.draftClass = null;
        state.draftHorse = null;
        state.selectedClass = null;
        state.selectedHorse = null;
        closeAdd();
      }

      function renderOptionLists() {
        els.classOptions.innerHTML = state.classRows.map((row) =>
          `<option value="${escapeHtml(classFormDescription(row))}"></option>`
        ).join("");
        els.horseOptions.innerHTML = dedupeHorseCandidates([...state.scopedRows, ...state.sourceRows, ...state.helperHorseRows]).map((row) =>
          `<option value="${escapeHtml(horseName(row))}"></option>`
        ).join("");
      }

      function findClassByLine(value) {
        const exact = String(value || "").trim();
        return state.classRows.find((row) => classFormDescription(row) === exact) || null;
      }

      function findHorseByName(value) {
        const target = normalize(value);
        if (!target) return null;
        return dedupeHorseCandidates(state.helperHorseRows)
          .find((row) => normalize(horseName(row)) === target) || null;
      }

      function openAdd() {
        state.selectedClass = null;
        state.selectedHorse = null;
        els.addPanel.hidden = false;
        els.classInput.value = "";
        els.horseInput.value = "";
        els.classSuggestions.innerHTML = "";
        els.horseSuggestions.innerHTML = "";
        renderPickerState();
        requestAnimationFrame(() => els.horseInput.focus());
      }

      function closeAdd() {
        els.addPanel.hidden = true;
      }

      function renderPickerState() {
        const hasHorse = !!state.selectedHorse;
        const hasClass = !!state.selectedClass;
        els.selectedHorseChip.hidden = !hasHorse;
        els.selectedClassChip.hidden = !hasClass;
        els.horseInput.hidden = hasHorse;
        els.classInput.hidden = hasClass;
        els.selectedHorseText.textContent = hasHorse ? state.selectedHorse.barn_name : "";
        els.selectedClassText.textContent = hasClass ? className(state.selectedClass) : "";
      }

      function clearSelectedHorse() {
        state.selectedHorse = null;
        els.horseInput.value = "";
        els.horseSuggestions.innerHTML = "";
        renderPickerState();
        requestAnimationFrame(() => els.horseInput.focus());
      }

      function clearSelectedClass() {
        state.selectedClass = null;
        els.classInput.value = "";
        els.classSuggestions.innerHTML = "";
        renderPickerState();
        requestAnimationFrame(() => els.classInput.focus());
      }

      function searchClasses() {
        const q = normalize(els.classInput.value);
        if (q.length < 2) {
          els.classSuggestions.innerHTML = "";
          return;
        }
        const parts = q.split(/\s+/).filter(Boolean);
        const matches = state.classRows
          .map((row) => ({ row, search: classSearchText(row) }))
          .filter((item) => parts.every((part) => item.search.includes(part)))
          .slice(0, 12);
        els.classSuggestions.innerHTML = matches.map((item, index) => `
          <button class="suggestion" type="button" data-class-index="${index}">
            <strong>${escapeHtml(className(item.row))}</strong>
          </button>
        `).join("");
        els.classSuggestions.querySelectorAll("[data-class-index]").forEach((button) => {
          button.addEventListener("click", () => selectClass(matches[Number(button.dataset.classIndex)].row));
        });
      }

      function selectClass(row) {
        state.selectedClass = row;
        els.classInput.value = "";
        els.classSuggestions.innerHTML = "";
        renderPickerState();
        if (!state.selectedHorse) requestAnimationFrame(() => els.horseInput.focus());
      }

      async function searchHorses() {
        const q = normalize(els.horseInput.value);
        state.selectedHorse = null;
        renderPickerState();
        if (q.length < 2) {
          els.horseSuggestions.innerHTML = "";
          return;
        }
        const matches = dedupeHorseCandidates([...state.rows, ...state.helperHorseRows])
          .filter((row) => horseSearchText(row).includes(q))
          .slice(0, 12);
        els.horseSuggestions.innerHTML = matches.map((row, index) => `
          <button class="suggestion" type="button" data-horse-index="${index}">
            <strong>${escapeHtml(horseName(row))}</strong>
          </button>
        `).join("");
        els.horseSuggestions.querySelectorAll("[data-horse-index]").forEach((button) => {
          button.addEventListener("click", () => selectHorse(matches[Number(button.dataset.horseIndex)]));
        });
      }

      function dedupeHorseCandidates(rows) {
        const map = new Map();
        for (const row of rows || []) {
          const name = horseName(row);
          const key = normalize(name);
          if (!key || map.has(key)) continue;
          map.set(key, row);
        }
        return [...map.values()].sort((a, b) => horseName(a).localeCompare(horseName(b)));
      }

      function selectHorse(row) {
        state.selectedHorse = {
          barn_name: horseName(row),
          horse_name: row.horse_name || row.horse || horseName(row),
          horse_key: row.horse_key || ""
        };
        els.horseInput.value = "";
        els.horseSuggestions.innerHTML = "";
        renderPickerState();
        if (!state.selectedClass) requestAnimationFrame(() => els.classInput.focus());
      }

      function addSelectedRow() {
        if (!state.selectedClass || !state.selectedHorse) {
          status("Select one horse and one class.", "warn");
          return;
        }
        const klass = state.selectedClass;
        const horse = state.selectedHorse;
        const row = {
          review_key: `user|${Date.now()}|${klass.class_no || klass.class_number}|${normalize(horse.barn_name)}`,
          source: "user_added",
          status: "pending",
          show_no: klass.show_no || DEFAULT_SHOW_NO,
          focus_day: klass.focus_day || focusDay(),
          focus_show_record_id: state.schedulePayload?.focus_show_record_id || "",
          ring_day_no: klass.ring_day_no || "",
          ring_no: klass.ring_no || "",
          ring_name_normalized: ringName(klass),
          class_no: klass.class_no || "",
          class_number: klass.class_number || "",
          class_name: className(klass),
          class_start_time: klass.class_start_time || "",
          display_time: displayTime(klass),
          entry_no: "",
          barn_name: horse.barn_name,
          horse_name: horse.horse_name,
          horse_key: horse.horse_key,
          pencil_in: !!horse.pencil_in
        };
        state.rows = dedupeRows([...state.rows, row]);
        setGridRows();
        closeAdd();
        status(`Added ${row.barn_name} to ${row.class_no || row.class_number}.`);
      }

      function buildPrintSheet() {
        const generatedAt = new Date().toLocaleString();
        const groupedByRing = groupRowsByRing(state.rows);
        els.printSheet.innerHTML = `
          <div class="print-title">
            <h1>Barn Entry Review</h1>
            <p>Show ${escapeHtml(DEFAULT_SHOW_NO)}<br>${escapeHtml(focusDay())}<br>${escapeHtml(generatedAt)}</p>
          </div>
          <div class="print-columns">
            ${[...groupedByRing.entries()].map(([ring, rows]) => `
              <section class="print-ring-group">
                <div class="print-ring">${escapeHtml(ring)}</div>
                ${rows.map((row) => `
                  <div class="print-row">
                    <span>${escapeHtml(displayTime(row))}</span>
                    <span>${escapeHtml([row.class_number || row.class_no, className(row)].filter(Boolean).join(" - "))}</span>
                    <span class="print-horse">${escapeHtml(row.barn_name)} | ${escapeHtml(row.status || "pending")}</span>
                  </div>
                `).join("")}
              </section>
            `).join("")}
          </div>
        `;
      }

      function groupRowsByRing(rows) {
        const groups = new Map();
        for (const row of rows) {
          const ring = ringName(row) || "UNASSIGNED RING";
          if (!groups.has(ring)) groups.set(ring, []);
          groups.get(ring).push(row);
        }
        return groups;
      }

      function printReview() {
        buildPrintSheet();
        window.print();
      }

      function renderReview() {
        const rows = state.rows;
        const table = `
          <table class="review-table">
            <thead>
              <tr><th>Status</th><th>Time</th><th>Ring</th><th>Class</th><th>Horse</th></tr>
            </thead>
            <tbody>
              ${rows.map((row) => `
                <tr class="review-${escapeHtml(row.status || "pending")}">
                  <td>${escapeHtml(statusLabel(row.status || "pending"))}</td>
                  <td>${escapeHtml(displayTime(row))}</td>
                  <td>${escapeHtml(ringName(row))}</td>
                  <td>${escapeHtml([row.class_number || row.class_no, className(row)].filter(Boolean).join(" - "))}</td>
                  <td>${escapeHtml(row.barn_name)}</td>
                </tr>
              `).join("")}
            </tbody>
          </table>
        `;
        els.reviewCopy.innerHTML = `<div class="status">${rows.length} row(s)</div>${table}`;
      }

      function reviewText() {
        const lines = ["Barn Entry Review", `Show ${DEFAULT_SHOW_NO}`, `Date ${focusDay()}`, ""];
        for (const row of state.rows) {
          lines.push([
            displayTime(row),
            ringName(row),
            row.class_no || row.class_number,
            row.barn_name,
            row.status
          ].filter(Boolean).join(" | "));
        }
        return lines.join("\n");
      }

      async function submitRows() {
        if (!state.rows.length) {
          status("No rows to submit", "bad");
          return;
        }
        const payload = {
          source: "barn_entry_ag_review",
          submitted_at: new Date().toISOString(),
          row_count: state.rows.length,
          rows: state.rows
        };
        els.submitBtn.disabled = true;
        status("Submitting...");
        try {
          const response = await fetch(SUBMIT_URL, {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify(payload)
          });
          const result = await response.json().catch(() => ({}));
          if (!response.ok || result.ok !== true) {
            els.submitBtn.disabled = false;
            status(result.error || `Submit failed ${response.status}`, "bad");
            return;
          }
        } catch (error) {
          els.submitBtn.disabled = false;
          status(error.message || String(error), "bad");
          return;
        }
        renderReview();
        els.formPanel.hidden = true;
        els.addPanel.hidden = true;
        els.gridPanel.hidden = true;
        els.bottomSubmit.hidden = true;
        els.submitBtn.classList.add("is-hidden");
        els.reviewPanel.hidden = false;
        setShellMode("print");
        els.reviewPanel.scrollIntoView({ behavior: "smooth", block: "start" });
      }

      async function shareReview() {
        const text = reviewText();
        if (navigator.share) {
          await navigator.share({ title: "Barn Entry Review", text });
          return;
        }
        await navigator.clipboard.writeText(text);
      }

      async function load() {
        await ensureAgGridLoaded();
        initGrid();
        state.gridApi?.showLoadingOverlay?.();
        status("Loading schedule...");
        await loadSchedule();
        els.focusDateText.textContent = TRAINER_FILTER ? `${focusDay()} | ${TRAINER_FILTER}` : focusDay();
        status("Loading mapped entries...");
        state.sourceRows = await fetchClassOogRows();
        state.scopedRows = state.sourceRows.filter(rowMatchesTrainer);
        state.rows = dedupeRows(state.scopedRows.map(reviewRowFromEntry));
        renderOptionLists();
        setGridRows();
        state.gridApi?.hideOverlay?.();
        status(`${state.rows.length} mapped row(s). Tap status to confirm or decline.`);
        fetchHorseHelpers(TRAINER_FILTER || "")
          .then((rows) => {
            state.helperHorseRows = rows;
            state.rows = dedupeRows(state.scopedRows.map(reviewRowFromEntry));
            renderOptionLists();
            setGridRows();
            status(`${state.rows.length} mapped row(s).`);
          })
          .catch(() => {
            state.helperHorseRows = [];
          });
      }

      els.cancelAddBtn.addEventListener("click", closeAdd);
      els.openAddBtn.addEventListener("click", openAdd);
      els.clearHorseBtn.addEventListener("click", clearSelectedHorse);
      els.clearClassBtn.addEventListener("click", clearSelectedClass);
      els.classInput.addEventListener("input", debounce(searchClasses));
      els.horseInput.addEventListener("input", debounce(searchHorses));
      els.confirmAddBtn.addEventListener("click", addSelectedRow);
      els.editBtn.addEventListener("click", toggleEditMode);
      els.miniEditBtn.addEventListener("click", toggleEditMode);
      els.printBtn.addEventListener("click", printReview);
      els.submitBtn.addEventListener("click", submitRows);
      els.reviewPrintBtn.addEventListener("click", printReview);
      els.shareBtn.addEventListener("click", shareReview);
      load().catch((error) => status(error.message || String(error), "bad"));
    })();
  </script>
</body>
</html>
