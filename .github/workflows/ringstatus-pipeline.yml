name: ringstatus-pipeline
on:
  workflow_dispatch: {}
  schedule:
    - cron: "*/5 * * * *"

concurrency:
  group: ringstatus-pipeline
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
      AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
      SHOWTIME_URL: ${{ secrets.SHOWTIME_URL }}
      AIRTABLE_TABLE: tblCnHDB4IVtxqulo
      AIRTABLE_VIEW_HOT: viwATt1y2RKpn2FSZ
      CUSTOMER_ID: "15"
      DRY_RUN: "0"
      CALC_MODE: promote
      WATCH_VIEW: heartbeat
      PUBLISHER_DELAY_SECONDS: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run full ringstatus pipeline
        shell: bash
        run: |
          set -u
          deferred_failed=0

          run_step() {
            local label="$1"
            local script="$2"
            local continue_on_error="${3:-0}"

            echo "==> ${label} (${script})"
            if node "${script}"; then
              echo "OK: ${label}"
            else
              code=$?
              echo "FAIL (${code}): ${label}"
              if [ "${continue_on_error}" = "1" ]; then
                deferred_failed=1
              else
                exit "${code}"
              fi
            fi
          }

          run_step "TAGGER" "tagger.js"
          run_step "HEARTBEAT_PATTERNS" "heartbeat_patterns.js"
          run_step "SCHEDULES_DAILYV2" "schedules_dailyv2.js"
          run_step "SCHEDULES_CALCULATORV2" "schedules_calculatorv2.js" "1"
          run_step "TRIPS_DAILYV2" "trips_dailyv2.js"
          run_step "TRIPS_TAGGER" "trips_tagger.js"
          run_step "TRIPS_CALCULATORV2" "trips_calculatorv2.js" "1"

          if [ "${deferred_failed}" = "1" ]; then
            echo "Skipping publisher because deferred steps failed."
            exit 1
          fi

          run_step "PUBLISH" "publisher.js"
