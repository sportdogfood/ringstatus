name: ringstatus-pipeline
on:
  workflow_dispatch: {}

concurrency:
  group: ringstatus-pipeline
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
      AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
      SHOWTIME_URL: ${{ secrets.SHOWTIME_URL }}
      AIRTABLE_TABLE: tblCnHDB4IVtxqulo
      AIRTABLE_VIEW_HOT: viwATt1y2RKpn2FSZ
      DRY_RUN: "0"
      CALC_MODE: promote
      WATCH_VIEW: heartbeat
      PUBLISHER_DELAY_SECONDS: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Resolve focused show scope
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("fs");

          (async () => {
            const baseId = process.env.AIRTABLE_BASE_ID;
            const token = process.env.AIRTABLE_TOKEN;
            const tableName = process.env.TABLE_SHOW_TARGET || "show";
            if (!baseId || !token) throw new Error("Missing AIRTABLE_BASE_ID or AIRTABLE_TOKEN");

            const params = new URLSearchParams({
              pageSize: "100",
              filterByFormula: "{heartbeat}",
            });
            for (const field of ["show_id", "customer_id", "focus_day", "start_date", "end_date", "heartbeat"]) {
              params.append("fields[]", field);
            }

            const url = `https://api.airtable.com/v0/${baseId}/${encodeURIComponent(tableName)}?${params}`;
            const response = await fetch(url, { headers: { Authorization: `Bearer ${token}` } });
            const body = await response.text();
            if (!response.ok) throw new Error(`Focused show lookup failed ${response.status}: ${body}`);
            const payload = JSON.parse(body);
            const rows = payload.records || [];
            const today = new Intl.DateTimeFormat("en-CA", {
              timeZone: "America/New_York",
              year: "numeric",
              month: "2-digit",
              day: "2-digit",
            }).format(new Date());
            const inActiveWindow = (fields) => {
              if (!fields.start_date || !fields.end_date) return true;
              return String(fields.start_date) <= today && today <= String(fields.end_date);
            };
            const activeShows = rows.filter((row) => inActiveWindow(row.fields || {})).map((row) => {
              const fields = row.fields || {};
              const showId = fields.show_id;
              const customerId = fields.customer_id;
              const focusDay = fields.focus_day;
              if (!showId) throw new Error(`Focused show row ${row.id} missing show_id`);
              if (!customerId) throw new Error(`Focused show row ${row.id} missing customer_id`);
              if (!focusDay) throw new Error(`Focused show row ${row.id} missing focus_day`);
              return {
                record_id: row.id,
                show_id: showId,
                customer_id: customerId,
                focus_day: focusDay,
              };
            });

            if (activeShows.length === 0) {
              fs.appendFileSync(process.env.GITHUB_ENV, "HEARTBEAT_NO_ACTIVE_FEEDS=true\nHEARTBEAT_ACTIVE_SHOWS_JSON=[]\n");
              console.log("No focused show rows with heartbeat checked; tagger will write no-active-feeds heartbeat.");
              return;
            }

            const lines = [
              "HEARTBEAT_NO_ACTIVE_FEEDS=false",
              `HEARTBEAT_ACTIVE_SHOWS_JSON=${JSON.stringify(activeShows)}`,
              `CUSTOMER_ID=${activeShows[0].customer_id}`,
              `HEARTBEAT_TARGET_CUSTOMER_ID=${activeShows[0].customer_id}`,
              `HEARTBEAT_TARGET_APP_SHOW_ID=${activeShows[0].show_id}`,
              `HEARTBEAT_TARGET_SHOW_RECORD_ID=${activeShows[0].record_id}`,
              `HEARTBEAT_TARGET_SQL_DATES=${activeShows[0].focus_day}`,
            ];
            fs.appendFileSync(process.env.GITHUB_ENV, `${lines.join("\n")}\n`);
            console.log(`Focused show rows: ${activeShows.length}`);
          })().catch((error) => {
            console.error(error.stack || error.message);
            process.exit(1);
          });
          NODE

      - name: Run full ringstatus pipeline
        shell: bash
        run: |
          set -u

          run_step() {
            local label="$1"
            local script="$2"
            local continue_on_error="${3:-0}"

            echo "==> ${label} (${script})"
            if node "${script}"; then
              echo "OK: ${label}"
            else
              code=$?
              echo "FAIL (${code}): ${label}"
              if [ "${continue_on_error}" = "1" ]; then
                deferred_failed=1
              else
                exit "${code}"
              fi
            fi
          }

          run_pipeline_for_current_show() {
            deferred_failed=0

            run_step "TAGGER" "tagger.js"

            if [ "${HEARTBEAT_NO_ACTIVE_FEEDS:-false}" = "true" ]; then
              echo "No active focused shows; heartbeat was written with no-active-feeds. Skipping downstream lanes."
              return 0
            fi

            run_step "HEARTBEAT_PATTERNS" "heartbeat_patterns.js"
            run_step "SCHEDULES_DAILYV2" "schedules_dailyv2.js"
            run_step "SCHEDULES_CALCULATORV2" "schedules_calculatorv2.js" "1"
            run_step "TRIPS_DAILYV2" "trips_dailyv2.js"
            run_step "TRIPS_TAGGER" "trips_tagger.js"
            run_step "TRIPS_CALCULATORV2" "trips_calculatorv2.js" "1"
            run_step "LIVE_GROUPS_DAILY" "live_groups_daily.js" "1"

            if [ "${deferred_failed}" = "1" ]; then
              echo "Skipping publisher because deferred steps failed."
              exit 1
            fi

            run_step "PUBLISH" "publisher.js"
          }

          if [ "${HEARTBEAT_NO_ACTIVE_FEEDS:-false}" = "true" ]; then
            run_pipeline_for_current_show
            exit 0
          fi

          active_show_rows=$(node - <<'NODE'
          const rows = JSON.parse(process.env.HEARTBEAT_ACTIVE_SHOWS_JSON || "[]");
          for (const row of rows) {
            console.log(Buffer.from(JSON.stringify(row), "utf8").toString("base64"));
          }
          NODE
          )

          for row in ${active_show_rows}; do # for row in active_shows
            eval "$(ROW_B64="${row}" node - <<'NODE'
            const row = JSON.parse(Buffer.from(process.env.ROW_B64, "base64").toString("utf8"));
            const quote = (value) => String(value ?? "").replace(/'/g, "'\\''");
            console.log(`export HEARTBEAT_NO_ACTIVE_FEEDS='false'`);
            console.log(`export CUSTOMER_ID='${quote(row.customer_id)}'`);
            console.log(`export HEARTBEAT_TARGET_CUSTOMER_ID='${quote(row.customer_id)}'`);
            console.log(`export HEARTBEAT_TARGET_APP_SHOW_ID='${quote(row.show_id)}'`);
            console.log(`export HEARTBEAT_TARGET_SHOW_RECORD_ID='${quote(row.record_id)}'`);
            console.log(`export HEARTBEAT_TARGET_SQL_DATES='${quote(row.focus_day)}'`);
            NODE
            )"
            echo "Focused show scope: customer_id=${CUSTOMER_ID} show_id=${HEARTBEAT_TARGET_APP_SHOW_ID} focus_day=${HEARTBEAT_TARGET_SQL_DATES} record_id=${HEARTBEAT_TARGET_SHOW_RECORD_ID}"
            run_pipeline_for_current_show
          done
