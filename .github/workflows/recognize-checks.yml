name: Recognize checks
on:
  push:
    branches: [work/inputs-crm-20261006]
    paths: ['webflow-cloud-test/**', '.github/workflows/recognize-checks.yml']
  pull_request:
    paths: ['webflow-cloud-test/**', '.github/workflows/recognize-checks.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: webflow-cloud-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: webflow-cloud-test/package-lock.json
      - run: npm ci
      - run: npm run test:recognize
      - run: npm run test:runtime
