<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ring Classes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/sportdogfood/ringstatus@df8d9d4eb0652f76c952ed718b36e774100148f4/webflow/packing-worksheet/styles.css">
  <link rel="stylesheet" href="ag-report-shared.css">
  <script src="https://cdn.jsdelivr.net/npm/ag-grid-community@36.0.0/dist/ag-grid-community.min.js"></script>
</head>
<body>
  <main id="packing-app" class="rsa-dashboard"></main>
  <script>
    (() => {
      const API_BASE = "https://horseshowing-700800454.development.catalystserverless.com/server/horseshowing_sync/";
      const params = new URLSearchParams(location.search);
      const showNo = params.get("show_no") || "14910";
      const focusDay = params.get("focus_day") || "2026-07-08";
      const text = value => String(value ?? "");
      const normalize = value => text(value).toLowerCase().replace(/[^a-z0-9']+/g, " ").trim();
      const displayTime = row => row.display_time || row.time_text || row.time || "";
      const ringName = row => row.ring_name_normalized || row.ring_display || row.ring_name || row.ring || "";
      const className = row => row.class_name || row.class_description || "";
      const classLabel = row => [row.class_number || row.class_no, className(row)].filter(Boolean).join(" - ");

      async function fetchJson(url) {
        const response = await fetch(url);
        const data = await response.json().catch(() => ({}));
        if (!response.ok || data.ok !== true) throw new Error(data.error || data.blocker || "HTTP " + response.status);
        return data;
      }

      function flattenRollups(rollups, fallbackLabel) {
        const items = [];
        for (const rollup of Array.isArray(rollups) ? rollups : []) {
          const trainer = text(rollup.trainer_display || rollup.trainer).trim();
          for (const horse of Array.isArray(rollup.horses) ? rollup.horses : []) {
            const name = text(horse.horse_name || horse.name || horse.label).trim();
            if (name) items.push({ name, trainer, order: horse.order || horse.entry_order || "" });
          }
        }
        if (!items.length && fallbackLabel) text(fallbackLabel).split(/[|,]/).map(value => value.trim()).filter(Boolean).forEach(name => items.push({ name }));
        return items;
      }

      function localRows() {
        return [
          { id:"local|indoor1|404", ring_name_normalized:"Indoor 1", display_time:"8:30 AM", class_number:"404", class_no:"31361", class_name:"$10,000 USHJA UF Vet Derby 3' Open", entry_count:3, status:"soon", horse_items:[{name:"Chiloe LS",trainer:"AG Equestrian"},{name:"Carapaccio",trainer:"AG Equestrian"}], entries:[] },
          { id:"local|indoor1|406", ring_name_normalized:"Indoor 1", display_time:"1:00 PM", class_number:"406", class_no:"31363", class_name:"Golden Ocala Hunter Derby 3'6/3'9", entry_count:2, status:"soon", horse_items:[{name:"Hermes",trainer:"Sample Barn"},{name:"Kindly",trainer:"Sample Barn"}], entries:[] },
          { id:"local|indoor6|638", ring_name_normalized:"Indoor 6", display_time:"7:30 AM", class_number:"638", class_no:"31357", class_name:"$500 1.20m Jumper II.2b", entry_count:3, status:"now", current_horse:"Calypso", horse_items:[{name:"Calypso",order:"1"},{name:"Dodicci",order:"2"},{name:"Ideal",order:"3"}], entries:[] },
          { id:"local|grand|4404", ring_name_normalized:"Grand", display_time:"10:00 AM", class_number:"4404", class_no:"33332", class_name:"FEI $63,000 MARS Equestrian 1.45m CSI4*", entry_count:2, status:"soon", horse_items:[{name:"Markanto A"},{name:"Cervin"}], entries:[] }
        ];
      }

      function prepareRows(rows) {
        return rows.slice().sort((a,b)=>ringName(a).localeCompare(ringName(b),undefined,{numeric:true})||displayTime(a).localeCompare(displayTime(b))||text(a.class_number||a.class_no).localeCompare(text(b.class_number||b.class_no),undefined,{numeric:true})).map(row=>{
          const entries=(row.horse_items||[]).map((item,index)=>({entryKey:[row.id,"entry",item.order||index+1,normalize(item.name||item.label)].join("|"),name:item.name||item.label||"",order:item.order||index+1,trainer:item.trainer||"",source:item}));
          return {rowKey:"rss|"+row.id,classKey:row.id,entryState:entries.length?"rss-is-hydrated":"rss-is-empty",time:displayTime(row)||"--",ring:ringName(row),className:classLabel(row),entryCount:row.entry_count??entries.length,status:row.status||"scheduled",entries,drawer_source:row};
        });
      }

      function drawerDetail(row) {
        const source = row.drawer_source || row;
        const entries = (row.entries || []).map(item => ({ time:row.time, name:item.name, meta:item.order || item.trainer || "" }));
        return { title:row.className||classLabel(source), subtitle:[row.ring||ringName(source),row.time||displayTime(source),row.status||source.status].filter(Boolean).join(" | "), details:[{label:"Ring",value:row.ring||ringName(source)},{label:"Class",value:row.className||classLabel(source)},{label:"Status",value:row.status||source.status||"scheduled"},{label:"Entries",value:row.entryCount??entries.length}], entries };
      }

      function entryDrawerDetail(row,entry) {
        return {title:entry.name||"Entry",subtitle:[row.className,row.ring,row.time].filter(Boolean).join(" | "),entriesTitle:"Class entries",details:[{label:"Horse",value:entry.name||""},{label:"Entry order",value:entry.order||"--"},{label:"Trainer",value:entry.trainer||""},{label:"Class",value:row.className||""},{label:"Ring",value:row.ring||""},{label:"Time",value:row.time||""}],entries:(row.entries||[]).map(item=>({time:row.time,name:item.name,meta:item.order||item.trainer||"",selected:item.entryKey===entry.entryKey}))};
      }

      window.RS_AG_REPORT_CONFIG = {
        id:"ring-classes", output:"ring-classes", title:"Ring Classes",
        data:{ async load(){
          if (location.protocol === "file:") return { rows:localRows(), context:{focusDay}, meta:[showNo,focusDay,"local reference"].join(" | "), message:"local reference rows loaded" };
          const url=new URL(API_BASE); url.searchParams.set("action","wec-mobile-live"); url.searchParams.set("show_no",showNo); url.searchParams.set("focus_day",focusDay); const data=await fetchJson(url);
          const rows=(data.rings||[]).flatMap(ring=>(ring.classes||[]).map((klass,index)=>({ ...klass, id:klass.row_key||[data.show_no||showNo,klass.ring_day_no||ring.ring_no||"",klass.class_no||klass.class_number||index].join("|"), ring_name_normalized:ring.ring_name_normalized||klass.ring_name_normalized||ring.ring_display||"", horse_items:Array.isArray(klass.horse_items)?klass.horse_items:flattenRollups(klass.rollups,klass.rollup_label) })));
          const day=data.show_focus_date||data.focus_day||focusDay; return {rows,context:{focusDay:day},meta:[data.show_no||showNo,day].join(" | "),message:"live ring classes loaded"};
        }},
        columns:report=>[{headerName:"Classes",flex:1,autoHeight:true,sortable:false,resizable:false,cellClass:"rss-shape-cell",cellRenderer:report.renderers.rssRowShapeRenderer}],
        actions:[
          {id:"print",label:"Print",zone:"header",type:"print"},
          {id:"focus",label:"Focus",zone:"header",type:"focus",active:r=>r.state.focusMode},
          {id:"horse",label:"Horse",zone:"header",type:"filter",active:r=>r.state.filterPanelOpen||!!r.state.activeHorseFilters.size},
          {id:"clear",label:"Clear",zone:"primary",type:"clear"}
        ],
        filters:{ ring:ringName, horse:{mode:"options",values:row=>(row.horse_items||[]).map(item=>item.name||item.label)}, focus:rows=>rows.filter(row=>row.is_focus||row.current_horse||(row.horse_items||[]).length) },
        row:{ shape:"rss", getId:row=>row.rowKey, prepare:prepareRows, drawer:drawerDetail, entryDrawer:entryDrawerDetail },
        print:{ title:"Ring Classes", meta:r=>[showNo,r.state.context.focusDay||focusDay].join(" | "), rollup:row=>(row.horse_items||[]).map(item=>item.name||item.label).join(" | "), columns:[{width:"44px",value:displayTime},{width:"58px",value:row=>ringName(row).toUpperCase()},{width:"28px",value:row=>row.class_number||row.class_no||""},{width:"minmax(0,1fr)",value:className}] }
      };
    })();
  </script>
  <script src="ag-report-runtime.js"></script>
</body>
</html>
