<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ring Classes</title>
  <link rel="stylesheet" href="ag-report-shared.css">
  <script src="https://cdn.jsdelivr.net/npm/ag-grid-community@36.0.0/dist/ag-grid-community.min.js"></script>
</head>
<body>
  <div id="agReportRoot"></div>
  <script>
    (() => {
      const API_BASE = "https://horseshowing-700800454.development.catalystserverless.com/server/horseshowing_sync/";
      const params = new URLSearchParams(location.search);
      const showNo = params.get("show_no") || "14910";
      const focusDay = params.get("focus_day") || "2026-07-08";

      const text = value => String(value ?? "");
      const normalize = value => text(value).toLowerCase().replace(/[^a-z0-9']+/g, " ").trim();
      const displayTime = row => row.display_time || row.time_text || row.time || "";
      const ringName = row => row.ring_name_normalized || row.ring_display || row.ring_name || row.ring || "";
      const className = row => row.class_name || row.class_description || "";

      async function fetchJson(url) {
        const response = await fetch(url);
        const data = await response.json().catch(() => ({}));
        if (!response.ok || data.ok !== true) throw new Error(data.error || data.blocker || "HTTP " + response.status);
        return data;
      }

      function rowHorses(row) {
        return [
          row.current_horse,
          ...(row.horse_items || []).map(item => item.name || item.label),
          ...(row.entries || []).map(entry => entry.barn_name || entry.horse_name || entry.horse)
        ].filter(Boolean);
      }

      function classGroupKey(row) {
        return [normalize(ringName(row)), normalize(displayTime(row)), row.class_number || row.class_no || "", normalize(className(row))].join("|");
      }

      function focusRows(rows) {
        const groups = new Map();
        rows.forEach(row => {
          const key = [normalize(ringName(row)), normalize(displayTime(row)), normalize(className(row))].join("|");
          if (!groups.has(key)) groups.set(key, []);
          groups.get(key).push(row);
        });
        return rows.filter(row => {
          const key = [normalize(ringName(row)), normalize(displayTime(row)), normalize(className(row))].join("|");
          const group = groups.get(key) || [];
          if (group.length < 2) return true;
          const keep = group.slice().sort((a, b) => Number(a.class_number || a.class_no || 999999999) - Number(b.class_number || b.class_no || 999999999))[0];
          return row.id === keep.id;
        });
      }

      function rowsWithSpecialSummaries(rows) {
        const output = [];
        const seen = new Set();
        rows.forEach(row => {
          const key = classGroupKey(row);
          if (!seen.has(key)) {
            seen.add(key);
            output.push({ ...row, id: "special|" + key, __special: true, entry_count: rows.filter(candidate => classGroupKey(candidate) === key).length });
          }
          output.push(row);
        });
        return output;
      }

      window.RS_AG_REPORT_CONFIG = {
        id: "ring-classes",
        output: "ring-classes",
        title: "Ring Classes",
        data: {
          async load() {
            const url = new URL(API_BASE);
            url.searchParams.set("action", "wec-mobile-live");
            url.searchParams.set("show_no", showNo);
            url.searchParams.set("focus_day", focusDay);
            const data = await fetchJson(url);
            const rows = (data.rings || []).flatMap(ring => (ring.classes || []).map((klass, index) => ({
              ...klass,
              id: klass.row_key || [data.show_no || showNo, data.show_focus_date || data.focus_day || focusDay, klass.ring_day_no || ring.ring_no || "", klass.class_no || klass.class_number || index].join("|"),
              show_no: data.show_no || showNo,
              focus_day: data.show_focus_date || data.focus_day || focusDay,
              ring_name_normalized: ring.ring_name_normalized || klass.ring_name_normalized || ring.ring_display || ""
            })));
            const currentDay = data.show_focus_date || data.focus_day || focusDay;
            return { rows, context: { focusDay: currentDay }, meta: [data.show_no || showNo, currentDay].join(" | "), message: "loaded ring classes" };
          }
        },
        columns: [
          { headerName: "TIME", field: "display_time", minWidth: 78, width: 88, valueGetter: params => displayTime(params.data) },
          { headerName: "RING", field: "ring_name_normalized", minWidth: 78, width: 88, valueGetter: params => ringName(params.data).toUpperCase() },
          { headerName: "NO", field: "class_number", minWidth: 56, width: 60, valueGetter: params => params.data.class_number || params.data.class_no || "" },
          { headerName: "CLASS", field: "class_name", minWidth: 170, flex: 1 },
          { headerName: "IN", field: "starts_in_mins", minWidth: 56, width: 60, hide: true, valueFormatter: params => params.value == null || params.value === "" ? "" : `${params.value}m` },
          { headerName: "STATUS", field: "class_status", minWidth: 88, width: 88, hide: true }
        ],
        actions: [
          { id: "print", label: "Print", zone: "header", type: "print" },
          { id: "focus", label: "Focus", zone: "header", type: "focus", active: report => report.state.focusMode },
          { id: "horse", label: "Horse", zone: "header", type: "filter", active: report => report.state.filterPanelOpen || !!report.state.activeHorseFilters.size },
          { id: "clear", label: "Clear", zone: "primary", type: "clear" }
        ],
        filters: {
          ring: row => ringName(row),
          horse: { mode: "options", values: row => rowHorses(row) },
          focus: rows => focusRows(rows)
        },
        row: {
          getId: row => row.id,
          isSpecial: row => !!row?.__special,
          decorate: rows => rowsWithSpecialSummaries(rows),
          specialSummary: row => ({ time: displayTime(row), ring: ringName(row).toUpperCase(), number: row.class_number || row.class_no || "", name: className(row), count: row.entry_count || 0 }),
          onCellClicked(params, report) { if (params.data?.__special) report.setStatus("special row has no underlying detail data"); }
        },
        print: {
          title: "Ring Classes",
          meta: report => [showNo, report.state.context.focusDay || focusDay].join(" | "),
          columns: [
            { width: "44px", value: row => displayTime(row) },
            { width: "58px", value: row => ringName(row).toUpperCase() },
            { width: "28px", value: row => row.class_number || row.class_no || "" },
            { width: "minmax(0,1fr)", value: row => className(row) }
          ]
        }
      };
    })();
  </script>
  <script src="ag-report-runtime.js"></script>
</body>
</html>
