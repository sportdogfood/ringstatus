<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RingStatus AG Grid Prototype</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      --ink: #fff;
      --muted: #b8c2cf;
      --line: #3b4656;
      --panel: #252f3e;
      --surface: #1f2836;
      --chrome: #2f3845;
      --time-col-width: 74px;
      --total-col-width: 58px;
      --rollup-slot-height: 16px;
      --row-height-compact: 38px;
      --row-height-rollup: 54px;
      --row-height-group: 34px;
      --row-main-height: 28px;
      --cell-font-size: 11px;
      --cell-line-height: 1.15;
      --cell-font-weight: 600;
      --grid-readable-width: 620px;
      --content-width: clamp(393px, 92vw, 1180px);
      --schedule-width: min(100%, var(--grid-readable-width));
      --accent: #0f766e;
      --changed: #6b4f13;
      --changed-border: #eab308;
      --danger: #fb7185;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Inter, Arial, Helvetica, sans-serif;
      color: var(--ink);
      background: #151c27;
    }

    button,
    input {
      font: inherit;
    }

    .app-shell {
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto auto 1fr;
    }

    .topbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 14px;
      align-items: center;
      justify-content: space-between;
      width: var(--content-width);
      max-width: 100%;
      justify-self: center;
      padding: 14px 16px;
      background: #fff;
      background: var(--surface);
      border-bottom: 1px solid var(--line);
    }

    .title h1 {
      margin: 0;
      font-size: 18px;
      line-height: 1.2;
      letter-spacing: 0;
    }

    .title p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 12px;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .button {
      border: 1px solid #b7c3d0;
      background: var(--chrome);
      color: var(--ink);
      border-radius: 6px;
      padding: 8px 10px;
      min-height: 36px;
      cursor: pointer;
    }

    .button.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    .button.danger {
      border-color: #fecdd3;
      color: var(--danger);
    }

    .button:disabled {
      opacity: .55;
      cursor: not-allowed;
    }

    .endpoint-panel {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto auto;
      gap: 8px;
      width: var(--content-width);
      max-width: 100%;
      justify-self: center;
      padding: 10px 16px;
      background: var(--panel);
      border-bottom: 1px solid var(--line);
    }

    .endpoint-panel label {
      display: grid;
      gap: 4px;
      color: var(--muted);
      font-size: 12px;
    }

    .endpoint-panel input[type="url"] {
      width: 100%;
      border: 1px solid #b7c3d0;
      border-radius: 6px;
      padding: 8px 10px;
      background: var(--surface);
      color: var(--ink);
      min-height: 36px;
    }

    .toggle {
      display: inline-flex;
      align-items: end;
      gap: 6px;
      color: var(--muted);
      font-size: 12px;
      padding-bottom: 8px;
      white-space: nowrap;
    }

    .status-line {
      grid-column: 1 / -1;
      min-height: 18px;
      color: var(--muted);
      font-size: 12px;
    }

    .visual-filter {
      grid-column: 1 / -1;
      display: inline-flex;
      width: fit-content;
      max-width: 100%;
      gap: 2px;
      padding: 4px;
      border: 1px solid var(--ag-border-color, var(--line));
      border-radius: 8px;
      background: #111827;
      overflow-x: auto;
    }

    .mode-bar {
      grid-column: 1 / -1;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
    }

    .mode-button {
      appearance: none;
      border: 1px solid var(--ag-border-color, var(--line));
      border-radius: 999px;
      min-height: 28px;
      padding: 5px 10px;
      background: var(--surface);
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
    }

    .mode-button.is-active {
      background: color-mix(in srgb, #3ea1ff 22%, var(--surface));
      border-color: #3ea1ff;
      color: #fff;
    }

    .mode-button[disabled] {
      cursor: not-allowed;
      opacity: .5;
    }

    .visual-filter button {
      appearance: none;
      border: 0;
      border-radius: 6px;
      padding: 7px 12px;
      background: transparent;
      color: var(--muted);
      font-size: 12px;
      font-weight: 650;
      white-space: nowrap;
      cursor: pointer;
    }

    .visual-filter button.is-active {
      background: #fff;
      color: #05070b;
      box-shadow: 0 1px 3px rgba(0, 0, 0, .18);
    }

    .filter-scope {
      grid-column: 1 / -1;
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      align-items: center;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
    }

    .filter-scope button {
      border: 1px solid var(--ag-border-color, var(--line));
      border-radius: 999px;
      min-height: 24px;
      padding: 3px 8px;
      background: #111827;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
    }

    .status-line.error {
      color: var(--danger);
      font-weight: 600;
    }

    .grid-wrap {
      min-height: 0;
      width: var(--content-width);
      max-width: 100%;
      justify-self: center;
      padding: 8px;
    }

    #rsGrid {
      height: calc(100vh - 154px);
      min-height: 420px;
      width: var(--schedule-width);
      border-radius: 8px;
      overflow: hidden;
    }

    #rsGrid.ag-theme-quartz,
    #rsGrid .ag-root-wrapper,
    #rsGrid .ag-root {
      color-scheme: dark;
      --ag-font-family: Inter, Arial, Helvetica, sans-serif;
      --ag-font-size: 13px;
      --ag-foreground-color: #fff;
      --ag-background-color: #1f2836;
      --ag-header-background-color: #2f3845;
      --ag-header-foreground-color: #fff;
      --ag-odd-row-background-color: #242f3f;
      --ag-row-hover-color: #334155;
      --ag-selected-row-background-color: #23423f;
      --ag-border-color: #3b4656;
      --ag-secondary-border-color: #3b4656;
      --ag-header-column-resize-handle-color: #7f8b9c;
      --ag-input-background-color: #151c27;
      --ag-input-border-color: #4b5565;
      --ag-chrome-background-color: #2f3845;
      --ag-row-border-width: 0px;
      --ag-range-selection-border-color: transparent;
    }

    #rsGrid .ag-row-even:not(.ag-full-width-row) {
      background: #1f2836;
    }

    #rsGrid .ag-row-odd:not(.ag-full-width-row) {
      background: #253246;
    }

    #rsGrid .ag-cell,
    #rsGrid .ag-header-cell-text {
      color: #fff;
    }

    #rsGrid .ag-row,
    #rsGrid .ag-cell {
      border-top-width: 0 !important;
      border-bottom-width: 0 !important;
    }

    #rsGrid .ag-cell {
      padding-top: 0 !important;
      padding-bottom: 0 !important;
      padding-left: 0 !important;
      padding-right: 0 !important;
    }

    #rsGrid .ag-cell-focus,
    #rsGrid .ag-cell:focus,
    #rsGrid .ag-cell:focus-within {
      border-color: transparent !important;
      outline: none !important;
      box-shadow: none !important;
    }

    #rsGrid .rs-class-cell {
      overflow: visible;
    }

    .rs-cell-changed {
      background: var(--changed) !important;
      box-shadow: inset 0 -2px 0 var(--changed-border);
      font-weight: 700;
    }

    .rs-row-changed .ag-cell:first-child {
      border-left: 4px solid var(--changed-border);
    }

    .rs-row-hidden-local {
      opacity: .45;
      text-decoration: line-through;
    }

    .ring-section-header {
      display: flex;
      align-items: center;
      height: 100%;
      padding: 0 12px;
      background: var(--ag-header-background-color);
      color: var(--ag-header-foreground-color);
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0;
      text-transform: uppercase;
      border-top: 1px solid var(--ag-border-color);
      border-bottom: 1px solid var(--ag-border-color);
    }

    .schedule-cell {
      position: relative;
      display: grid;
      grid-template-rows: var(--rollup-slot-height) 1fr;
      align-content: center;
      gap: 4px;
      min-height: 100%;
      padding: 5px 0;
      color: var(--ag-foreground-color);
      font-size: var(--cell-font-size);
      line-height: var(--cell-line-height);
    }

    .schedule-cell.is-compact {
      grid-template-rows: 1fr;
      gap: 0;
      padding-top: 0;
      padding-bottom: 0;
    }

    .schedule-cell.is-center {
      justify-items: center;
      text-align: center;
      font-size: var(--cell-font-size);
      font-weight: var(--cell-font-weight);
    }

    .cell-rollup-slot {
      min-width: 0;
      min-height: var(--rollup-slot-height);
      display: flex;
      align-items: center;
    }

    .cell-rollup-slot.is-row-overlay {
      position: absolute;
      z-index: 2;
      top: 5px;
      left: calc(-1 * var(--time-col-width));
      right: calc(-1 * var(--total-col-width));
      height: var(--rollup-slot-height);
      min-height: var(--rollup-slot-height);
      padding: 0 10px;
      pointer-events: none;
      overflow: hidden;
    }

    .cell-main-line {
      min-width: 0;
      display: flex;
      align-items: center;
      color: var(--ag-foreground-color);
      font-size: var(--cell-font-size);
      line-height: var(--cell-line-height);
    }

    .cell-main-line.is-center {
      justify-content: center;
      text-align: center;
      font-weight: var(--cell-font-weight);
    }

    .schedule-cell.is-compact .cell-main-line,
    .schedule-cell.is-compact .class-title-line {
      height: var(--row-main-height);
      min-height: var(--row-main-height);
    }

    .rollup-summary {
      display: flex;
      align-items: center;
      gap: 5px;
      width: 100%;
      min-width: 0;
      color: var(--ag-foreground-color);
      font-size: var(--cell-font-size);
      font-weight: 650;
      text-transform: uppercase;
    }

    .rollup-badge {
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      min-width: 42px;
      max-width: 56px;
      overflow: hidden;
      text-overflow: ellipsis;
      padding: 2px 6px;
      border-radius: 999px;
      background: color-mix(in srgb, #3ea1ff 10%, transparent);
      color: var(--ag-foreground-color);
      font-size: 9px;
      line-height: 1;
      border: 1px solid color-mix(in srgb, #3ea1ff 58%, var(--ag-border-color));
      white-space: nowrap;
    }

    .rollup-badge::before {
      content: "";
      width: 7px;
      height: 7px;
      flex: 0 0 7px;
      border-radius: 50%;
      background: #3ea1ff;
    }

    .rollup-names {
      flex: 1 1 auto;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .class-title-line {
      min-width: 0;
      min-height: 18px;
      display: flex;
      align-items: center;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--ag-foreground-color);
      font-size: var(--cell-font-size);
      font-weight: var(--cell-font-weight);
      line-height: var(--cell-line-height);
    }

    .schedule-cell:not(.is-compact) .class-title-line {
      grid-row: 2;
      height: var(--row-main-height);
      min-height: var(--row-main-height);
    }

    .schedule-cell:not(.is-compact) .cell-main-line {
      grid-row: 2;
      height: var(--row-main-height);
      min-height: var(--row-main-height);
    }

    .total-pill {
      min-width: 26px;
      padding: 2px 7px;
      border-radius: 999px;
      background: color-mix(in srgb, #6d9b7e 72%, transparent);
      color: #fff;
      line-height: 1.25;
      font-size: 11px;
      font-weight: 700;
    }

    .drawer {
      position: fixed;
      inset: 0 0 0 auto;
      width: min(520px, 94vw);
      transform: translateX(105%);
      transition: transform .18s ease;
      background: var(--surface);
      box-shadow: -16px 0 30px rgba(15, 23, 42, .2);
      z-index: 10;
      display: grid;
      grid-template-rows: auto auto 1fr;
      border-left: 1px solid var(--line);
    }

    .drawer-backdrop {
      position: fixed;
      inset: 0;
      z-index: 9;
      display: none;
      background: rgba(5, 9, 15, .18);
    }

    .drawer-backdrop.is-open {
      display: block;
    }

    .drawer.is-open {
      transform: translateX(0);
    }

    .drawer-head {
      display: flex;
      justify-content: space-between;
      align-items: start;
      gap: 10px;
      padding: 16px;
      border-bottom: 1px solid var(--line);
    }

    .drawer-head h2 {
      margin: 0;
      font-size: 16px;
    }

    .drawer-head p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 12px;
      word-break: break-word;
    }

    .drawer-actions {
      display: flex;
      gap: 8px;
      padding: 10px 16px;
      border-bottom: 1px solid var(--line);
    }

    .drawer-detail {
      overflow: auto;
      background: #f8fafc;
      color: #071a2f;
    }

    .detail-title {
      padding: 14px 16px 10px;
      border-bottom: 1px solid #d7dde5;
      background: #fff;
    }

    .detail-title h3 {
      margin: 0;
      color: #061b33;
      font-size: 17px;
      line-height: 1.25;
      font-weight: 800;
    }

    .detail-pill-row {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
      padding: 10px 16px 6px;
      background: #fff;
    }

    .detail-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 32px;
      border-radius: 6px;
      background: #e5e7eb;
      color: #071a2f;
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
    }

    .detail-metrics {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      border-top: 1px solid #111827;
      border-bottom: 1px solid #111827;
      background: #d8dadd;
      text-align: center;
    }

    .detail-metric {
      padding: 7px 4px 8px;
      border-right: 1px solid #c0c5cc;
    }

    .detail-metric:last-child {
      border-right: 0;
    }

    .detail-metric label {
      display: block;
      color: #5f6875;
      font-size: 11px;
      line-height: 1.1;
      font-weight: 800;
      text-transform: uppercase;
    }

    .detail-metric strong {
      display: block;
      margin-top: 7px;
      color: #68717d;
      font-size: 12px;
      font-weight: 800;
    }

    .detail-entry-list {
      background: #fff;
    }

    .detail-entry {
      display: grid;
      grid-template-columns: 74px minmax(0, 1fr) 42px minmax(118px, auto);
      gap: 7px;
      align-items: center;
      padding: 9px 8px;
      border-bottom: 1px solid #dbe1e8;
      color: #061b33;
      font-size: 13px;
      font-weight: 700;
    }

    .detail-entry:nth-child(even) {
      background: #f8fafc;
    }

    .detail-time,
    .detail-order,
    .detail-eta {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 28px;
      border-radius: 5px;
      background: #e5e7eb;
      color: #061b33;
      font-weight: 700;
      white-space: nowrap;
    }

    .detail-name {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .detail-empty {
      padding: 18px 16px;
      color: #64748b;
      font-size: 13px;
    }

    .print-sheet {
      display: none;
    }

    @media (min-width: 721px) {
      .grid-wrap {
        padding: 12px 16px 16px;
      }

      .ring-section-header {
        padding: 0 14px;
        font-size: 15px;
      }
    }

    @media (max-width: 720px) {
      .endpoint-panel {
        grid-template-columns: 1fr;
      }

      .visual-filter {
        width: 100%;
      }

      .toggle {
        align-items: center;
        padding-bottom: 0;
      }

      #rsGrid {
        height: calc(100vh - 224px);
      }
    }

    @media print {
      @page {
        size: landscape;
        margin: .35in;
      }

      body {
        background: #fff;
      }

      .app-shell,
      .drawer {
        display: none !important;
      }

      .print-sheet {
        display: block;
        color: #000;
        font-family: Arial, Helvetica, sans-serif;
      }

      .print-title {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 18px;
        padding-bottom: 8px;
        margin-bottom: 10px;
        border-bottom: 2px solid #000;
      }

      .print-title h1 {
        margin: 0;
        font-size: 16px;
      }

      .print-title p {
        margin: 0;
        font-size: 10px;
      }

      .print-columns {
        column-count: 3;
        column-gap: 14px;
      }

      .print-ring-group {
        break-inside: avoid;
        page-break-inside: avoid;
        display: block;
      }

      .print-row {
        break-inside: avoid;
        page-break-inside: avoid;
        display: grid;
        grid-template-columns: 50px minmax(0, 1fr);
        gap: 0;
        position: relative;
        min-height: 28px;
        padding: 2px 0;
        border-bottom: 1px solid #bbb;
        font-size: 8.5px;
        line-height: 1.18;
      }

      .print-row.has-rollup {
        background: #eef2f7;
        min-height: 38px;
        padding-top: 13px;
      }

      .print-row.is-zebra:not(.has-rollup) {
        background: #f8fafc;
      }

      .print-cell {
        display: flex;
        align-items: center;
        min-width: 0;
        padding: 0 2px;
        font-size: 8.5px;
      }

      .print-cell.time,
      .print-cell.total {
        justify-content: center;
        font-weight: 700;
      }

      .print-cell.class {
        font-weight: 500;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .print-rollup {
        position: absolute;
        top: 2px;
        left: 0;
        right: 0;
        display: flex;
        align-items: center;
        gap: 3px;
        min-width: 0;
        padding: 0 6px;
        font-size: 9px;
        font-weight: 700;
        line-height: 1.1;
        text-transform: uppercase;
        overflow: hidden;
        white-space: nowrap;
      }

      .print-rollup-names {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .print-ring {
        margin-top: 8px;
        padding: 4px 0 3px;
        border-bottom: 1px solid #000;
        font-size: 11px;
        font-weight: 700;
        break-after: avoid;
        page-break-after: avoid;
      }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="title">
        <h1>RingStatus AG Grid Prototype</h1>
        <p>Read-only Catalyst payload. Ring-grouped rows, local change markers, browser-only soft hide.</p>
      </div>
      <div class="actions">
        <button class="button primary" id="refreshBtn" type="button">Refresh Rows</button>
        <button class="button" id="printBtn" type="button">Print 3 Columns</button>
        <button class="button danger" id="clearStateBtn" type="button">Clear Browser State</button>
      </div>
    </header>

    <section class="endpoint-panel" aria-label="Data source">
      <label>
        Catalyst API endpoint
        <input id="endpointInput" type="url" spellcheck="false">
      </label>
      <label class="toggle">
        <input id="showHiddenInput" type="checkbox">
        Show soft-hidden
      </label>
      <div class="mode-bar" aria-label="Prototype modes">
        <button class="mode-button" id="hideModeBtn" type="button">Hides</button>
        <button class="mode-button is-active" type="button" aria-pressed="true">Filters</button>
        <button class="mode-button" id="focusModeBtn" type="button">Focus</button>
        <button class="mode-button" id="modePrintBtn" type="button">Print</button>
        <button class="mode-button" type="button" disabled title="Horse mode is still to discuss">Horses</button>
        <button class="mode-button" type="button" disabled title="Ring mode is still to discuss">Rings</button>
      </div>
      <div class="visual-filter" id="visualFilter" aria-label="Browser-only row filter">
        <button class="is-active" type="button" data-filter="all">All</button>
        <button type="button" data-filter="rollups">With Rollups</button>
        <button type="button" data-filter="empty">No Rollup</button>
        <button type="button" data-filter="changed">Changed</button>
      </div>
      <div class="filter-scope" aria-label="Filter scopes to wire">
        <span>Tiny filters:</span>
        <button type="button" disabled title="Rider source/semantics to discuss">Riders</button>
        <button type="button" disabled title="Status source/semantics to discuss">Status</button>
        <button type="button" disabled title="Class tag source/semantics to discuss">Class Tags</button>
      </div>
      <div class="status-line" id="statusLine">Loading...</div>
    </section>

    <main class="grid-wrap">
      <div id="rsGrid" class="ag-theme-quartz"></div>
    </main>
  </div>

  <div class="drawer-backdrop" id="drawerBackdrop" aria-hidden="true"></div>

  <aside class="drawer" id="rowDrawer" aria-label="Class detail drawer" aria-hidden="true">
    <div class="drawer-head">
      <div>
        <h2>Class Detail</h2>
        <p id="drawerKey">No row selected</p>
      </div>
      <button class="button" id="closeDrawerBtn" type="button">Close</button>
    </div>
    <div class="drawer-actions">
      <button class="button danger" id="hideRowBtn" type="button">Soft-hide row</button>
    </div>
    <div class="drawer-detail" id="drawerDetail"></div>
  </aside>

  <section class="print-sheet" id="printSheet" aria-hidden="true"></section>

  <script src="https://cdn.jsdelivr.net/npm/ag-grid-community@34.1.0/dist/ag-grid-community.min.js"></script>
  <script>
    (function () {
      "use strict";

      const DEFAULT_ENDPOINT = "https://horseshowing-700800454.development.catalystserverless.com/server/horseshowing_sync/?action=wec-mobile-live";
      const SNAPSHOT_KEY = "ringstatus-ag-grid.previousSnapshot.v1";
      const HIDDEN_KEY = "ringstatus-ag-grid.hiddenRows.v1";
      const ENDPOINT_KEY = "ringstatus-ag-grid.endpoint.v1";
      const ROW_HEIGHT_GROUP = 34;
      const ROW_HEIGHT_ROLLUP = 54;
      const ROW_HEIGHT_COMPACT = 38;

      const endpointInput = document.getElementById("endpointInput");
      const showHiddenInput = document.getElementById("showHiddenInput");
      const hideModeBtn = document.getElementById("hideModeBtn");
      const focusModeBtn = document.getElementById("focusModeBtn");
      const modePrintBtn = document.getElementById("modePrintBtn");
      const visualFilter = document.getElementById("visualFilter");
      const statusLine = document.getElementById("statusLine");
      const drawerBackdrop = document.getElementById("drawerBackdrop");
      const drawer = document.getElementById("rowDrawer");
      const drawerKey = document.getElementById("drawerKey");
      const drawerDetail = document.getElementById("drawerDetail");
      const hideRowBtn = document.getElementById("hideRowBtn");
      const printSheet = document.getElementById("printSheet");

      let gridApi = null;
      let allRows = [];
      let visibleRows = [];
      let selectedRow = null;
      let rowFilter = "all";
      let hideMode = false;
      let focusMode = false;
      let previousSnapshot = loadObject(SNAPSHOT_KEY, {});
      let hiddenRows = new Set(loadArray(HIDDEN_KEY));

      endpointInput.value = normalizeStoredEndpoint(localStorage.getItem(ENDPOINT_KEY)) || DEFAULT_ENDPOINT;

      const changedCellRule = (field) => ({
        "rs-cell-changed": (params) => Boolean(params.data && params.data.__changedFields && params.data.__changedFields[field])
      });

      function buildQuartzDarkTheme() {
        if (!window.agGrid || !window.agGrid.themeQuartz || typeof window.agGrid.themeQuartz.withParams !== "function") {
          return "legacy";
        }
        return window.agGrid.themeQuartz.withParams({
          backgroundColor: "#1f2836",
          browserColorScheme: "dark",
          chromeBackgroundColor: {
            ref: "foregroundColor",
            mix: 0.07,
            onto: "backgroundColor"
          },
          fontFamily: {
            googleFont: "Inter"
          },
          foregroundColor: "#FFF"
        });
      }

      function ringFullWidthRenderer(params) {
        return '<div class="ring-section-header">' + escapeHtml(params.data && params.data.ring ? params.data.ring : "") + '</div>';
      }

      function classCellRenderer(params) {
        const row = params.data || {};
        const rollup = rollupSummaryHtml(row);
        const classTitle = [row.class_number, row.class_name].map(text).filter(Boolean).join(" - ");
        const hasRollup = Boolean(rollup);
        return '<div class="schedule-cell' + (hasRollup ? '' : ' is-compact') + '">' +
          (hasRollup ? '<div class="cell-rollup-slot is-row-overlay">' + rollup + '</div>' : '') +
          '<div class="class-title-line">' + escapeHtml(classTitle || row.row_key || "") + '</div>' +
        '</div>';
      }

      function compactCellRenderer(field, options) {
        return (params) => {
          const hasRollup = Boolean(params.data && params.data.horse_items && params.data.horse_items.length);
          const value = params.data && params.data[field] ? params.data[field] : "";
          const valueHtml = options && options.pill && value
            ? '<span class="total-pill">' + escapeHtml(value) + '</span>'
            : escapeHtml(value);
          return '<div class="schedule-cell is-center' + (hasRollup ? '' : ' is-compact') + '">' +
          (hasRollup ? '<div class="cell-rollup-slot"></div>' : '') +
          '<div class="cell-main-line is-center">' + valueHtml + '</div>' +
        '</div>';
        };
      }

      const columnDefs = [
        { headerName: "Time", field: "time", width: 74, resizable: false, cellRenderer: compactCellRenderer("time"), cellClassRules: changedCellRule("time") },
        { headerName: "Class", field: "class_display", minWidth: 190, flex: 1, cellClass: "rs-class-cell", cellRenderer: classCellRenderer },
        { headerName: "Total", field: "entry_count", width: 58, resizable: false, cellRenderer: compactCellRenderer("entry_count", { pill: true }) }
      ];

      const gridOptions = {
        columnDefs,
        rowData: [],
        getRowId: (params) => String(params.data.row_key),
        animateRows: false,
        suppressCellFocus: false,
        defaultColDef: {
          sortable: false,
          resizable: true,
          filter: false
        },
        getRowHeight: (params) => {
          if (params.data && params.data.__group) return ROW_HEIGHT_GROUP;
          return params.data && params.data.horse_items && params.data.horse_items.length ? ROW_HEIGHT_ROLLUP : ROW_HEIGHT_COMPACT;
        },
        isFullWidthRow: (params) => Boolean(params.rowNode && params.rowNode.data && params.rowNode.data.__group),
        fullWidthCellRenderer: ringFullWidthRenderer,
        rowClassRules: {
          "rs-row-changed": (params) => Boolean(params.data && params.data.__row_changed),
          "rs-row-hidden-local": (params) => Boolean(params.data && params.data.__hidden),
          "rs-row-rollup": (params) => Boolean(params.data && params.data.horse_items && params.data.horse_items.length),
          "rs-row-compact": (params) => Boolean(params.data && !params.data.__group && (!params.data.horse_items || !params.data.horse_items.length))
        },
        onRowClicked: (event) => {
          if (!event.data || event.data.__group) return;
          if (hideMode) {
            toggleRowHidden(event.data);
            return;
          }
          openDrawer(event.data);
        }
      };

      function text(value) {
        if (value === null || value === undefined) return "";
        if (Array.isArray(value)) return value.map(text).filter(Boolean).join(", ");
        if (typeof value === "object") return text(value.name || value.label || value.value || value.display || "");
        return String(value).trim();
      }

      function loadObject(key, fallback) {
        try {
          const parsed = JSON.parse(localStorage.getItem(key) || "");
          return parsed && typeof parsed === "object" && !Array.isArray(parsed) ? parsed : fallback;
        } catch (_error) {
          return fallback;
        }
      }

      function loadArray(key) {
        try {
          const parsed = JSON.parse(localStorage.getItem(key) || "[]");
          return Array.isArray(parsed) ? parsed.map(String) : [];
        } catch (_error) {
          return [];
        }
      }

      function setStatus(message, isError) {
        statusLine.textContent = message;
        statusLine.classList.toggle("error", Boolean(isError));
      }

      function normalizeStoredEndpoint(endpoint) {
        if (!endpoint) return "";
        const fallback = activeFocusFallbackEndpoint(endpoint);
        if (fallback && endpoint.includes("show_no=14907")) return fallback;
        return endpoint;
      }

      function activeFocusFallbackEndpoint(endpoint) {
        try {
          const url = new URL(endpoint);
          if (url.searchParams.get("action") !== "wec-mobile-live") return "";
          if (!url.searchParams.has("show_no")) return "";
          url.searchParams.delete("show_no");
          return url.toString();
        } catch (_error) {
          return "";
        }
      }

      async function fetchPayload(endpoint) {
        const response = await fetch(endpoint, { method: "GET", cache: "no-store" });
        const contentType = response.headers.get("content-type") || "";
        const payload = contentType.includes("application/json") ? await response.json() : await response.text();
        if (!response.ok) {
          const error = new Error("HTTP " + response.status + ": " + (typeof payload === "string" ? payload.slice(0, 220) : JSON.stringify(payload)));
          error.payload = payload;
          throw error;
        }
        if (payload && payload.ok === false) {
          const error = new Error(payload.error || "Catalyst endpoint returned ok=false");
          error.payload = payload;
          throw error;
        }
        return payload;
      }

      function sourceRowsFromPayload(payload) {
        if (Array.isArray(payload)) return payload.map((row) => ({ row, ring: null }));
        if (Array.isArray(payload.rows)) return payload.rows.map((row) => ({ row, ring: null }));
        if (payload.data && Array.isArray(payload.data.rows)) return payload.data.rows.map((row) => ({ row, ring: null }));
        if (Array.isArray(payload.rings)) {
          const flattened = [];
          payload.rings.forEach((ring) => {
            (Array.isArray(ring.classes) ? ring.classes : []).forEach((row) => flattened.push({ row, ring }));
          });
          return flattened;
        }
        if (payload.wec_mobile_pro && Array.isArray(payload.wec_mobile_pro.rings)) {
          const flattened = [];
          payload.wec_mobile_pro.rings.forEach((ring) => {
            (Array.isArray(ring.classes) ? ring.classes : []).forEach((row) => flattened.push({ row, ring }));
          });
          return flattened;
        }
        return [];
      }

      function firstText() {
        for (let i = 0; i < arguments.length; i += 1) {
          const value = text(arguments[i]);
          if (value) return value;
        }
        return "";
      }

      function truthy(value) {
        if (value === true) return true;
        const normalized = text(value).toLowerCase();
        return normalized === "true" || normalized === "1" || normalized === "yes" || normalized === "checked";
      }

      function rowKey(row, ring, index) {
        return firstText(
          row.row_key,
          row.class_key,
          row.schedule_key,
          row.update_schedule_staging_key,
          [row.ring_day_no, row.ring_no, row.class_no, row.time_sort || row.class_priority_sort].map(text).filter(Boolean).join("|"),
          [ring && (ring.ring_no || ring.ring_display), row.class_no, index].map(text).filter(Boolean).join("|")
        ) || "row-" + index;
      }

      function sortPriority(value) {
        const raw = text(value);
        if (!raw) return 999999;
        const numeric = Number(raw);
        return Number.isFinite(numeric) ? numeric : raw;
      }

      function ringSortValue(row, ring) {
        return sortPriority(firstText(row.ring_name_prioritized, ring.ring_name_prioritized, ring.ring_priority, row.ring_no, ring.ring_no));
      }

      function horseRollupItems(row) {
        const source = Array.isArray(row.rollups) ? row.rollups : [];
        const horses = [];
        source.forEach((rollup) => {
          const rollupHorses = Array.isArray(rollup && rollup.horses) ? rollup.horses : [];
          rollupHorses.forEach((horse) => {
            const name = firstText(horse && horse.barn_name, horse && horse.display, horse && horse.horse, horse && horse.label);
            if (!name) return;
            const order = firstText(horse && horse.entry_order, horse && horse.order_of_go, horse && horse.order, horse && horse.entry_no);
            horses.push({ name, order });
          });
        });
        return horses;
      }

      function horseRollupText(items) {
        return (items || []).map((item) => item.order ? item.name + " (" + item.order + ")" : item.name).join("; ");
      }

      function trainerBadges(row) {
        const seen = new Set();
        const badges = [];
        const source = Array.isArray(row.rollups) ? row.rollups : [];
        source.forEach((rollup) => {
          const label = firstText(rollup && rollup.trainer_display, rollup && rollup.trainer);
          const key = label.toLowerCase();
          if (!key || seen.has(key)) return;
          seen.add(key);
          badges.push(label);
        });
        return badges;
      }

      function rollupSummaryHtml(row) {
        const items = Array.isArray(row.horse_items) ? row.horse_items : [];
        if (!items.length) return "";
        const names = items.map((item) => (
          item.order ? item.name + " (" + item.order + ")" : item.name
        )).join(", ");
        const badges = Array.isArray(row.trainer_badges) ? row.trainer_badges : [];
        return '<div class="rollup-summary">' +
          badges.slice(0, 2).map((badge) => '<span class="rollup-badge">' + escapeHtml(badge) + '</span>').join("") +
          '<span class="rollup-names">' + escapeHtml(names) + '</span>' +
        '</div>';
      }

      function minimalRow(item, index) {
        const row = item.row || {};
        const ring = item.ring || {};
        const key = rowKey(row, ring, index);
        const horseItems = horseRollupItems(row);
        const classNumber = firstText(row.class_number, row.class_no);
        const className = firstText(row.class_name);
        const current = {
          ring: firstText(row.ring_name_normalized, row.ring_name, row.ring_display, ring.ring_name_normalized, ring.ring_display, ring.ring_name, row.ring_no, ring.ring_no),
          ring_sort: ringSortValue(row, ring),
          horses: horseRollupText(horseItems),
          horse_items: horseItems,
          trainer_badges: trainerBadges(row),
          time: firstText(row.display_time, row.time_text, row.class_time, row.class_time_text, row.start_display, row.class_start_time, row.time),
          order_of_go: firstText(row.order_of_go, row.entry_order, row.order, row.draw, row.class_priority_sort),
          class_number: classNumber,
          class_name: className,
          class_display: [classNumber, className].filter(Boolean).join(" - "),
          entry_count: firstText(row.entry_count),
          status: firstText(row.status, row.class_status, row.live_flag, row.ring_status),
          is_focus: truthy(row.is_focus),
          row_key: key
        };
        const previous = previousSnapshot[key] || {};
        const changedFields = {
          time: Boolean(previous.time !== undefined && previous.time !== current.time),
          order_of_go: Boolean(previous.order_of_go !== undefined && previous.order_of_go !== current.order_of_go),
          status: Boolean(previous.status !== undefined && previous.status !== current.status)
        };
        return {
          ...current,
          __raw: row,
          __ring: ring,
          __changedFields: changedFields,
          __row_changed: changedFields.time || changedFields.order_of_go || changedFields.status,
          __hidden: hiddenRows.has(key)
        };
      }

      function compareRingGroups(a, b) {
        const av = a.sort;
        const bv = b.sort;
        if (typeof av === "number" && typeof bv === "number" && av !== bv) return av - bv;
        return String(av).localeCompare(String(bv), undefined, { numeric: true, sensitivity: "base" })
          || a.name.localeCompare(b.name, undefined, { numeric: true, sensitivity: "base" });
      }

      function buildGroupedRows(rows) {
        const groups = new Map();
        rows.forEach((row) => {
          const name = row.ring || "Unassigned";
          if (!groups.has(name)) groups.set(name, { name, sort: row.ring_sort, rows: [] });
          groups.get(name).rows.push(row);
        });
        return Array.from(groups.values()).sort(compareRingGroups).flatMap((group) => [
          {
            __group: true,
            row_key: "ring|" + group.name,
            horses: group.name,
            time: "",
            class_number: "",
            class_name: "",
            entry_count: "",
            ring: group.name
          },
          ...group.rows
        ]);
      }

      function saveSnapshot(rows) {
        const snapshot = {};
        rows.forEach((row) => {
          snapshot[row.row_key] = {
            time: row.time,
            order_of_go: row.order_of_go,
            status: row.status
          };
        });
        previousSnapshot = snapshot;
        localStorage.setItem(SNAPSHOT_KEY, JSON.stringify(snapshot));
      }

      function applyHiddenFilter() {
        const showHidden = showHiddenInput.checked;
        visibleRows = allRows.filter((row) => (
          (showHidden || !hiddenRows.has(row.row_key)) && rowMatchesVisualFilter(row) && rowMatchesFocusMode(row)
        )).map((row) => ({
          ...row,
          __hidden: hiddenRows.has(row.row_key)
        }));
        gridApi.setGridOption("rowData", buildGroupedRows(visibleRows));
        updateHiddenButton();
      }

      function rowMatchesFocusMode(row) {
        return !focusMode || !row.is_focus;
      }

      function rowMatchesVisualFilter(row) {
        if (rowFilter === "rollups") return Boolean(row.horse_items && row.horse_items.length);
        if (rowFilter === "empty") return !row.horse_items || !row.horse_items.length;
        if (rowFilter === "changed") return Boolean(row.__row_changed);
        return true;
      }

      function setVisualFilter(nextFilter) {
        rowFilter = nextFilter || "all";
        visualFilter.querySelectorAll("button[data-filter]").forEach((button) => {
          button.classList.toggle("is-active", button.dataset.filter === rowFilter);
        });
        applyHiddenFilter();
        setStatus("Loaded " + allRows.length + " rows. Visible " + visibleRows.length + ". Filter " + filterLabel(rowFilter) + ". Hidden locally " + hiddenRows.size + ".", false);
      }

      function filterLabel(filter) {
        if (filter === "rollups") return "With Rollups";
        if (filter === "empty") return "No Rollup";
        if (filter === "changed") return "Changed";
        return "All";
      }

      async function refreshRows() {
        let endpoint = endpointInput.value.trim();
        localStorage.setItem(ENDPOINT_KEY, endpoint);
        setStatus("Fetching Catalyst rows...", false);
        let fallbackNote = "";
        try {
          let payload;
          try {
            payload = await fetchPayload(endpoint);
          } catch (error) {
            const fallback = /requires active focus_show/i.test(error.message || "") ? activeFocusFallbackEndpoint(endpoint) : "";
            if (!fallback) throw error;
            payload = await fetchPayload(fallback);
            endpoint = fallback;
            endpointInput.value = fallback;
            localStorage.setItem(ENDPOINT_KEY, fallback);
            fallbackNote = " Used active-focus endpoint after the requested show_no was no longer active.";
          }
          const rawRows = sourceRowsFromPayload(payload);
          allRows = rawRows.map(minimalRow);
          applyHiddenFilter();
          const changedCount = allRows.filter((row) => row.__row_changed).length;
          saveSnapshot(allRows);
          setStatus("Loaded " + allRows.length + " rows. Visible " + visibleRows.length + ". Changed rows " + changedCount + ". Hidden locally " + hiddenRows.size + "." + fallbackNote, false);
        } catch (error) {
          allRows = [];
          visibleRows = [];
          gridApi.setGridOption("rowData", []);
          setStatus("Fetch failed: " + (error && error.message ? error.message : String(error)), true);
        }
      }

      function openDrawer(row) {
        selectedRow = row;
        drawerKey.textContent = row ? row.row_key : "No row selected";
        drawerDetail.innerHTML = renderDrawerDetail(row);
        drawerBackdrop.classList.add("is-open");
        drawer.classList.add("is-open");
        drawer.setAttribute("aria-hidden", "false");
        updateHiddenButton();
      }

      function renderDrawerDetail(row) {
        if (!row) return '<div class="detail-empty">No row selected.</div>';
        const raw = row.__raw || {};
        const classTitle = [row.class_number, row.class_name].map(text).filter(Boolean).join(" - ") || row.row_key;
        const entries = firstText(row.entry_count, raw.entry_count, raw.total);
        const gone = firstText(raw.n_gone, raw.gone, raw.entries_gone);
        const toGo = firstText(raw.n_to_go, raw.to_go, raw.entries_to_go) || calculateToGo(entries, gone);
        const ends = firstText(raw.ends_in, raw.ends_in_text, raw.starts_in, raw.starts_in_text, raw.time_delta_text);
        const pills = [
          row.ring,
          row.time,
          row.class_number,
          entries ? entries + " entries" : ""
        ].filter(Boolean);
        return '<div class="detail-title">' +
            '<h3>' + escapeHtml(classTitle) + '</h3>' +
          '</div>' +
          '<div class="detail-pill-row">' +
            pills.slice(0, 4).map((pill) => '<span class="detail-pill">' + escapeHtml(pill) + '</span>').join("") +
          '</div>' +
          '<div class="detail-metrics">' +
            detailMetric("Entries", entries || "--") +
            detailMetric("Gone", gone || "--") +
            detailMetric("To Go", toGo || "--") +
            detailMetric("Ends", ends || "--") +
          '</div>' +
          '<div class="detail-entry-list">' + drawerEntryRows(row, gone, ends) + '</div>';
      }

      function detailMetric(label, value) {
        return '<div class="detail-metric"><label>' + escapeHtml(label) + '</label><strong>' + escapeHtml(value) + '</strong></div>';
      }

      function calculateToGo(entries, gone) {
        const total = Number(entries);
        const completed = Number(gone);
        if (!Number.isFinite(total) || !Number.isFinite(completed)) return "";
        return String(Math.max(0, total - completed));
      }

      function drawerEntryRows(row, gone, ends) {
        const items = Array.isArray(row.horse_items) ? row.horse_items : [];
        if (!items.length) {
          return '<div class="detail-empty">No rollup horses available for this class row.</div>';
        }
        return items.map((item) => (
          '<div class="detail-entry">' +
            '<span class="detail-time">' + escapeHtml(row.time || "--") + '</span>' +
            '<span class="detail-name">' + escapeHtml(item.name || "Horse") + '</span>' +
            '<span class="detail-order">' + escapeHtml(item.order || gone || "--") + '</span>' +
            '<span class="detail-eta">' + escapeHtml(ends || "timing unavailable") + '</span>' +
          '</div>'
        )).join("");
      }

      function closeDrawer() {
        drawerBackdrop.classList.remove("is-open");
        drawer.classList.remove("is-open");
        drawer.setAttribute("aria-hidden", "true");
      }

      function updateHiddenButton() {
        if (!selectedRow) {
          hideRowBtn.disabled = true;
          hideRowBtn.textContent = "Soft-hide row";
          return;
        }
        hideRowBtn.disabled = false;
        hideRowBtn.textContent = hiddenRows.has(selectedRow.row_key) ? "Unhide row" : "Soft-hide row";
      }

      function toggleSelectedHidden() {
        if (!selectedRow) return;
        toggleRowHidden(selectedRow);
        updateHiddenButton();
      }

      function toggleRowHidden(row) {
        if (!row) return;
        if (hiddenRows.has(row.row_key)) hiddenRows.delete(row.row_key);
        else hiddenRows.add(row.row_key);
        localStorage.setItem(HIDDEN_KEY, JSON.stringify(Array.from(hiddenRows)));
        applyHiddenFilter();
        setStatus("Hide mode " + (hideMode ? "on" : "off") + ". Visible " + visibleRows.length + ". Hidden locally " + hiddenRows.size + ".", false);
      }

      function clearBrowserState() {
        localStorage.removeItem(SNAPSHOT_KEY);
        localStorage.removeItem(HIDDEN_KEY);
        previousSnapshot = {};
        hiddenRows = new Set();
        allRows = allRows.map((row) => ({
          ...row,
          __changedFields: { time: false, order_of_go: false, status: false },
          __row_changed: false,
          __hidden: false
        }));
        applyHiddenFilter();
        setStatus("Cleared browser-only snapshot and soft-hide state. Refresh to establish a new comparison baseline.", false);
      }

      function groupedVisibleRows() {
        const groups = new Map();
        visibleRows.filter((row) => !hiddenRows.has(row.row_key)).forEach((row) => {
          const ring = row.ring || "Unassigned";
          if (!groups.has(ring)) groups.set(ring, []);
          groups.get(ring).push(row);
        });
        return Array.from(groups.entries());
      }

      function escapeHtml(value) {
        return text(value).replace(/[&<>"']/g, (char) => ({
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#39;"
        }[char]));
      }

      function buildPrintSheet() {
        const rows = groupedVisibleRows();
        const endpoint = endpointInput.value.trim();
        const generatedAt = new Date().toISOString();
        const body = rows.map(([ring, ringRows]) => {
          const lineRows = ringRows.map((row, rowIndex) => (
            '<div class="print-row' +
              (rowIndex % 2 ? ' is-zebra' : '') +
              (row.horse_items && row.horse_items.length ? ' has-rollup' : '') +
            '">' +
              printRollup(row) +
              '<span class="print-cell time">' + escapeHtml(row.time || "--") + '</span>' +
              '<span class="print-cell class">' + escapeHtml([row.class_number, row.class_name].map(text).filter(Boolean).join(" - ")) + '</span>' +
            '</div>'
          )).join("");
          return '<section class="print-ring-group">' +
            '<div class="print-ring">' + escapeHtml(ring) + '</div>' +
            lineRows +
          '</section>';
        }).join("");
        printSheet.innerHTML =
          '<div class="print-title">' +
            '<h1>RingStatus AG Grid Prototype</h1>' +
            '<p>' + escapeHtml(generatedAt) + '<br>' + escapeHtml(endpoint) + '</p>' +
          '</div>' +
          '<div class="print-columns">' + body + '</div>';
      }

      function printRollup(row) {
        const items = Array.isArray(row.horse_items) ? row.horse_items : [];
        if (!items.length) return "";
        const names = items.map((item) => (
          item.order ? item.name + " (" + item.order + ")" : item.name
        )).join(", ");
        return '<div class="print-rollup">' +
          '<span class="print-rollup-names">' + escapeHtml(names) + '</span>' +
        '</div>';
      }

      function printThreeColumn() {
        buildPrintSheet();
        window.print();
      }

      function toggleHideMode() {
        hideMode = !hideMode;
        hideModeBtn.classList.toggle("is-active", hideMode);
        hideModeBtn.setAttribute("aria-pressed", String(hideMode));
        setStatus("Hide mode " + (hideMode ? "on. Tap a row to hide/unhide it." : "off.") + " Visible " + visibleRows.length + ". Hidden locally " + hiddenRows.size + ".", false);
      }

      function toggleFocusMode() {
        focusMode = !focusMode;
        focusModeBtn.classList.toggle("is-active", focusMode);
        focusModeBtn.setAttribute("aria-pressed", String(focusMode));
        applyHiddenFilter();
        setStatus("Focus filter " + (focusMode ? "on. Rows marked is_focus are removed." : "off.") + " Visible " + visibleRows.length + ". Hidden locally " + hiddenRows.size + ".", false);
      }

      function initGrid() {
        const gridDiv = document.getElementById("rsGrid");
        if (!window.agGrid || typeof window.agGrid.createGrid !== "function") {
          setStatus("AG Grid Community failed to load from CDN.", true);
          return;
        }
        gridOptions.theme = buildQuartzDarkTheme();
        gridApi = window.agGrid.createGrid(gridDiv, gridOptions);
        refreshRows();
      }

      document.getElementById("refreshBtn").addEventListener("click", refreshRows);
      document.getElementById("printBtn").addEventListener("click", printThreeColumn);
      modePrintBtn.addEventListener("click", printThreeColumn);
      document.getElementById("clearStateBtn").addEventListener("click", clearBrowserState);
      document.getElementById("closeDrawerBtn").addEventListener("click", closeDrawer);
      drawerBackdrop.addEventListener("click", closeDrawer);
      hideRowBtn.addEventListener("click", toggleSelectedHidden);
      hideModeBtn.addEventListener("click", toggleHideMode);
      focusModeBtn.addEventListener("click", toggleFocusMode);
      showHiddenInput.addEventListener("change", applyHiddenFilter);
      visualFilter.addEventListener("click", (event) => {
        const button = event.target.closest("button[data-filter]");
        if (!button) return;
        setVisualFilter(button.dataset.filter);
      });
      endpointInput.addEventListener("change", refreshRows);
      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape") closeDrawer();
      });

      initGrid();
    }());
  </script>
</body>
</html>
