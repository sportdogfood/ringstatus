<div id="rs-wec-mobile-loader"></div>
<script>
(() => {
  const root = document.getElementById("rs-wec-mobile-loader");
  const endpoint = "https://horseshowing-700800454.development.catalystserverless.com/server/horseshowing_sync/?action=wec-mobile-embed-html";

  function runScripts(scope) {
    const scripts = Array.from(scope.querySelectorAll("script"));
    return scripts.reduce((chain, oldScript) => chain.then(() => new Promise((resolve, reject) => {
      const script = document.createElement("script");
      for (const attr of oldScript.attributes) script.setAttribute(attr.name, attr.value);
      if (oldScript.src) {
        script.onload = resolve;
        script.onerror = reject;
        script.src = oldScript.src;
      } else {
        script.textContent = oldScript.textContent;
      }
      oldScript.replaceWith(script);
      if (!script.src) resolve();
    })), Promise.resolve());
  }

  fetch(`${endpoint}&_=${Date.now()}`, { cache: "no-store" })
    .then((response) => {
      if (!response.ok) throw new Error(`WEC mobile embed failed ${response.status}`);
      return response.text();
    })
    .then((html) => {
      root.innerHTML = html;
      return runScripts(root);
    })
    .catch((error) => {
      root.innerHTML = `<div style="padding:12px;font:14px Arial,sans-serif;color:#111;">WEC schedule failed to load: ${String(error.message || error)}</div>`;
    });
})();
</script>
