<main class="rs-wec-print-page" id="rsWecPrintPage">
  <div class="rs-wec-print-top">
    <div>
      <h1 class="rs-wec-print-title" id="rsWecPrintTitle">Schedule</h1>
      <div class="rs-wec-print-subtitle" id="rsWecPrintSubtitle"></div>
      <div class="rs-wec-print-date" id="rsWecPrintDate"></div>
    </div>
    <div class="rs-wec-print-controls">
      <a class="rs-wec-print-btn" id="btnPdf" href="#" target="_blank" rel="noopener">PDF</a>
      <button class="rs-wec-print-btn" id="btnShare" type="button">Share</button>
    </div>
  </div>
  <section class="rs-wec-print-columns" id="rsWecPrintColumns" data-target-rows="0" data-left-rows="0" data-right-rows="0">
    <div class="rs-wec-print-column" id="rsWecPrintColL"></div>
    <div class="rs-wec-print-column" id="rsWecPrintColR"></div>
  </section>
  <footer class="rs-wec-print-updated" id="rsWecPrintUpdated"></footer>
</main>
<script>
(() => {
  const PDF_WORKER_BASE = "https://ringstatus-pdf.gombcg.workers.dev/";
  const SCHEDULE_URL = window.RS_WEC_SCHEDULE_URL || "https://horseshowing-700800454.development.catalystserverless.com/server/horseshowing_sync/?action=schedule-json&show_no=14906";
  const qs = new URLSearchParams(location.search);

  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));

  function rowsFromPayload(payload) {
    if (Array.isArray(payload)) return payload;
    if (payload && Array.isArray(payload.records)) return payload.records;
    return [];
  }

  function withQuery(url) {
    const u = new URL(url, location.href);
    const focusDay = qs.get("focus_day") || qs.get("focusDay") || "";
    if (focusDay && !u.searchParams.get("focus_day")) u.searchParams.set("focus_day", focusDay);
    u.searchParams.set("cb", String(Date.now()));
    return u.toString();
  }

  async function fetchJson(url) {
    const res = await fetch(withQuery(url), { cache: "no-store" });
    const text = await res.text();
    if (!res.ok) throw new Error(`schedule-json ${res.status}: ${text.slice(0, 200)}`);
    try { return JSON.parse(text); }
    catch { throw new Error(`schedule-json invalid JSON: ${text.slice(0, 200)}`); }
  }

  function compactTime(value) {
    const raw = String(value ?? "").trim();
    if (!raw) return "check time";
    if (/check/i.test(raw)) return "check time";
    const m = raw.match(/^(\d{1,2})(?::?(\d{2}))?\s*([AP])(?:M)?$/i);
    if (!m) return raw.replace(/\s+/g, "");
    const hour = String(Number(m[1]));
    const minute = String(m[2] || "00").padStart(2, "0");
    return `${hour}${minute}${m[3].toUpperCase()}`;
  }

  function classSortValue(row) {
    const seq = Number(row.class_group_sequence ?? row.classGroupSequence);
    if (Number.isFinite(seq)) return seq;
    const time = String(row.class_start_time || "");
    const num = Number(row.class_number ?? row.classNumber);
    return Number(`${time.replace(/\D/g, "").padEnd(6, "0")}${Number.isFinite(num) ? String(num).padStart(5, "0") : "99999"}`);
  }

  function ringSortValue(rows, index) {
    const minSeq = Math.min(...rows.map(classSortValue).filter(Number.isFinite));
    if (Number.isFinite(minSeq)) return minSeq;
    const ringNo = Number(rows[0]?.ring_number ?? rows[0]?.ring_no ?? rows[0]?.ringNo);
    return Number.isFinite(ringNo) ? ringNo : index + 9999;
  }

  function groupRows(rows) {
    const byRing = new Map();
    for (const row of rows) {
      const ringKey = String(row.ring_number ?? row.ring_no ?? row.ringNo ?? row.ring_name ?? "Ring");
      if (!byRing.has(ringKey)) byRing.set(ringKey, []);
      byRing.get(ringKey).push(row);
    }
    return Array.from(byRing.entries()).map(([ringKey, items], index) => {
      const first = items[0] || {};
      const ringName = String(first.ring_name ?? first.ringName ?? first.ring_display ?? first.ringDisplay ?? "Ring").trim() || "Ring";
      const unique = new Map();
      for (const item of items) {
        const key = String(item.class_no ?? item.classNo ?? item.class_group_id ?? item.classGroupId ?? `${item.class_number}|${item.class_name}|${item.start_display}`);
        if (!unique.has(key)) unique.set(key, item);
      }
      const classes = Array.from(unique.values()).sort((a, b) => classSortValue(a) - classSortValue(b));
      return { ringKey, ringName, classes, rowCount: classes.length + 2, sort: ringSortValue(items, index) };
    }).sort((a, b) => a.sort - b.sort);
  }

  function splitRingGroups(groups) {
    const total = groups.reduce((sum, group) => sum + group.rowCount, 0);
    const target = Math.ceil(total / 2);
    let bestIndex = groups.length;
    let bestDiff = Infinity;
    let running = 0;
    for (let i = 0; i < groups.length; i++) {
      running += groups[i].rowCount;
      const diff = Math.abs(target - running);
      if (diff < bestDiff) {
        bestDiff = diff;
        bestIndex = i + 1;
      }
    }
    const left = groups.slice(0, bestIndex);
    const right = groups.slice(bestIndex);
    return {
      left,
      right,
      targetRows: target,
      leftRows: left.reduce((sum, group) => sum + group.rowCount, 0),
      rightRows: right.reduce((sum, group) => sum + group.rowCount, 0)
    };
  }

  function renderRing(group) {
    const rows = group.classes.map((row) => {
      const classNo = String(row.class_no ?? row.classNo ?? "").trim();
      const ringDayNo = String(row.ring_day_no ?? row.ringDayNo ?? "").trim();
      const entryCount = String(row.entry_count ?? row.entryCount ?? "").trim();
      const number = String(row.class_number ?? row.classNumber ?? "").trim();
      const className = String(row.class_name ?? row.className ?? row.name ?? "").trim();
      return `
        <tr data-ring-day-no="${esc(ringDayNo)}" data-class-no="${esc(classNo)}" data-entry-count="${esc(entryCount)}">
          <td class="time-col">${esc(compactTime(row.start_display ?? row.startDisplay ?? row.display_time ?? row.displayTime))}</td>
          <td class="number-col">${esc(number)}</td>
          <td class="class-col">${esc(className)}</td>
        </tr>`;
    }).join("");

    return `
      <section class="ring-group" data-print-rows="${esc(group.rowCount)}">
        <h2>${esc(group.ringName)}</h2>
        <table class="schedule-table">
          <colgroup>
            <col class="time-col-def">
            <col class="number-col-def">
            <col class="class-col-def">
          </colgroup>
          <thead>
            <tr>
              <th class="time-col">Time</th>
              <th class="number-col">#</th>
              <th class="class-head">Class</th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
      </section>`;
  }

  function setHeader(rows) {
    const first = rows[0] || {};
    const rawTitle = String(first.show_days_report_title ?? first.show_report_title ?? first.showTitle ?? first.show_id ?? "Schedule").trim();
    const title = rawTitle.replace(/\s+CSI2\*?\s*$/i, "").trim() || rawTitle;
    const subtitle = rawTitle === title ? "" : rawTitle.slice(title.length).trim();
    const focusDate = String(first.show_days_display_date ?? first.show_day_key ?? first.focus_day ?? "").trim();
    document.getElementById("rsWecPrintTitle").textContent = title;
    document.getElementById("rsWecPrintSubtitle").textContent = subtitle;
    document.getElementById("rsWecPrintDate").textContent = focusDate ? `Day: ${focusDate}` : "";
  }

  function pdfFilename() {
    const title = document.getElementById("rsWecPrintTitle")?.textContent || "wec-schedule";
    const date = document.getElementById("rsWecPrintDate")?.textContent || "";
    return `${title} ${date}`.replace(/\s+/g, " ").replace(/[^\w.\- ]+/g, "").trim().replace(/ +/g, "-").toLowerCase() + ".pdf";
  }

  function syncPdfControls() {
    const publicPrintUrl = window.RS_WEC_PRINT_URL || "https://ringstatus.com/wec-print";
    const pageUrl = location.protocol === "file:" ? `${publicPrintUrl}${location.search || ""}` : location.href;
    const pdfUrl = `${PDF_WORKER_BASE}?url=${encodeURIComponent(pageUrl)}&filename=${encodeURIComponent(pdfFilename())}`;
    const btnPdf = document.getElementById("btnPdf");
    if (btnPdf) btnPdf.href = pdfUrl;
    const btnShare = document.getElementById("btnShare");
    if (btnShare && btnShare.dataset.bound !== "1") {
      btnShare.dataset.bound = "1";
      btnShare.addEventListener("click", async () => {
        if (navigator.share) {
          try {
            await navigator.share({ title: "WEC Schedule", text: "PDF schedule", url: pdfUrl });
            return;
          } catch (err) {
            if (err && err.name === "AbortError") return;
          }
        }
        window.location.href = `mailto:?subject=${encodeURIComponent("WEC Schedule")}&body=${encodeURIComponent(`PDF schedule:\n${pdfUrl}`)}`;
      });
    }
  }

  function markReady() {
    document.documentElement.dataset.rsPdfReady = "1";
    window.RS_PDF_READY = true;
  }

  async function boot() {
    try {
      const rows = rowsFromPayload(await fetchJson(SCHEDULE_URL));
      const colL = document.getElementById("rsWecPrintColL");
      const colR = document.getElementById("rsWecPrintColR");
      if (!rows.length) {
        colL.innerHTML = `<div class="rs-wec-print-message">No schedule rows.</div>`;
        syncPdfControls();
        markReady();
        return;
      }

      setHeader(rows);
      const groups = groupRows(rows);
      const split = splitRingGroups(groups);
      const columns = document.getElementById("rsWecPrintColumns");
      columns.dataset.targetRows = String(split.targetRows);
      columns.dataset.leftRows = String(split.leftRows);
      columns.dataset.rightRows = String(split.rightRows);
      colL.innerHTML = split.left.map(renderRing).join("");
      colR.innerHTML = split.right.map(renderRing).join("");
      document.getElementById("rsWecPrintUpdated").textContent =
        `Last updated: ${new Date().toLocaleString([], { hour12: false })}`;
      syncPdfControls();
      markReady();
    } catch (err) {
      document.getElementById("rsWecPrintColL").innerHTML =
        `<div class="rs-wec-print-error">${esc(String(err && err.stack ? err.stack : err))}</div>`;
      syncPdfControls();
      markReady();
    }
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", boot, { once: true });
  } else {
    boot();
  }
})();
</script>
