    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.22);
    opacity: 0;
    pointer-events: none;
    transition: opacity .18s ease;
    z-index: 20;
  }
  .drawer-backdrop.open {
    opacity: 1;
    pointer-events: auto;
  }
  .drawer {
    position: fixed;
    top: 0;
    right: 0;
    height: 100vh;
    width: min(560px, 92vw);
    background: #fff;
    box-shadow: -10px 0 28px rgba(0,0,0,.22);
    transform: translateX(105%);
    transition: transform .22s ease;
    z-index: 30;
    display: flex;
    flex-direction: column;
  }
  .drawer.open {
    transform: translateX(0);
  }
  .drawer-head {
    background: #111;
    color: #fff;
    padding: 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;

  }

    font-size: 14px;
    line-height: 1.45;
    background: #f8fafc;
  }
  .drawer-summary .big {

    font-size: 16px;

  .drawer-json-title {
    padding: 9px 12px;
    font-size: 12px;
    font-weight: 700;
    border-bottom: 1px solid #ddd;
    color: #444;

    font-size: 12px;
    line-height: 1.35;

const hiddenRows = new Set();
let showHidden = false;

function keyFor(data) {
  return data.staging_key || data.row_id || `${data.ring_day_no}|${data.class_no}|${data.class_name}`;
}

function escapeHtml(value) {
  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

function updateStats() {
  const hidden = hiddenRows.size;
  const total = rows.length;
  const visible = showHidden ? total : total - hidden;
  document.getElementById("stats").textContent =
    `Visible rows: ${visible} | Hidden rows: ${hidden} | Total rows still in memory: ${total}`;
  document.getElementById("toggle-hidden").textContent = showHidden ? "Hide Hidden Rows Again" : "Show Hidden Rows";
}

function openDrawer(data) {
  const hidden = hiddenRows.has(keyFor(data));

  document.getElementById("drawer-summary").innerHTML = `
    <div class="big">${escapeHtml(data.time || "No time")} &nbsp; ${escapeHtml(data.class_number || "")}</div>
    <div>${escapeHtml(data.class_name || "")}</div>
    <br>
    <b>Ring:</b> ${escapeHtml(data.ring)}<br>
    <b>class_no:</b> ${escapeHtml(data.class_no)}
    &nbsp; <b>ring_no:</b> ${escapeHtml(data.ring_no)}
    &nbsp; <b>ring_day_no:</b> ${escapeHtml(data.ring_day_no)}<br>
    <b>OOG staging:</b> ${escapeHtml(data.oog_staging)}
    &nbsp; <b>Hidden:</b> ${hidden ? "YES" : "NO"}
  `;

  document.getElementById("drawer-json").textContent = JSON.stringify(data, null, 2);
  document.getElementById("drawer").classList.add("open");
  document.getElementById("backdrop").classList.add("open");
}

function closeDrawer() {
  document.getElementById("drawer").classList.remove("open");
  document.getElementById("backdrop").classList.remove("open");
}

const table = new Tabulator("#table", {
  data: rows,
  height: "100%",
  layout: "fitColumns",
  groupBy: "ring",
  printAsHtml: true,
  printStyled: true,
  printRowRange: "all",
  printHeader: "<h1>WEC Schedule — 14909 / 2026-07-02</h1>",
  initialSort: [
    {column:"ring_no", dir:"asc"},
    {column:"time_sort", dir:"asc"},
    {column:"class_number", dir:"asc"}
  ],
  rowFormatter: function(row) {
    const data = row.getData();
    const el = row.getElement();
    el.classList.toggle("has-oog", (data.oog_staging || 0) > 0);
    el.classList.toggle("hidden-row", hiddenRows.has(keyFor(data)));
  },
  columns: [
    {
      title: "View",
      field: "row_id",
      width: 70,
      hozAlign: "center",
      print: false,
      formatter: () => "<button class='row-btn view-btn'>View</button>",
      cellClick: function(e, cell) {
        e.stopPropagation();
        selectAndOpen(cell.getRow());
      }
    },
    {
      title: "Hide",
      field: "row_id",
      width: 78,
      hozAlign: "center",
      print: false,
      formatter: function(cell) {
        const data = cell.getRow().getData();
        return hiddenRows.has(keyFor(data))
          ? "<button class='row-btn unhide-btn'>Unhide</button>"
          : "<button class='row-btn hide-btn'>Hide</button>";
      },
      cellClick: function(e, cell) {
        e.stopPropagation();
        const row = cell.getRow();
        const data = row.getData();
        const key = keyFor(data);

        if (hiddenRows.has(key)) hiddenRows.delete(key);
        else hiddenRows.add(key);

        updateStats();
        table.refreshFilter();
        table.redraw(true);
        openDrawer(data);
      }
    },
    {title:"Time", field:"time", width:95, headerFilter:"input"},
    {title:"#", field:"class_number", width:70, headerFilter:"input"},
    {title:"Class", field:"class_name", headerFilter:"input", minWidth:280},
    {title:"OOG", field:"oog_staging", width:70, hozAlign:"center", sorter:"number"},
    {title:"Ring No", field:"ring_no", width:85, hozAlign:"center"},
    {title:"Ring Day", field:"ring_day_no", width:100, hozAlign:"center"},
    {title:"Class No", field:"class_no", width:100, hozAlign:"center"},
  ],
});

function applyHideFilter() {
  table.setFilter(function(data) {
    return showHidden || !hiddenRows.has(keyFor(data));
  });
}

function selectAndOpen(row) {
  document.querySelectorAll(".tabulator-row.selected-detail").forEach(el => el.classList.remove("selected-detail"));
  row.getElement().classList.add("selected-detail");
  openDrawer(row.getData());
}

table.on("rowClick", function(e, row) {
  selectAndOpen(row);
});

table.on("rowTap", function(e, row) {
  selectAndOpen(row);
});

document.getElementById("toggle-hidden").addEventListener("click", function() {
  showHidden = !showHidden;
  updateStats();
  applyHideFilter();
  table.redraw(true);
});

document.getElementById("clear-hidden").addEventListener("click", function() {
  hiddenRows.clear();
  showHidden = false;
  updateStats();
  applyHideFilter();
  table.redraw(true);
});

document.getElementById("print-full").addEventListener("click", function() {
  table.print("all", true, {columnGroups:false});
});

document.getElementById("close-drawer").addEventListener("click", closeDrawer);
document.getElementById("backdrop").addEventListener("click", closeDrawer);
document.addEventListener("keydown", function(e) {
  if (e.key === "Escape") closeDrawer();
});

table.on("tableBuilt", function() {
  updateStats();
  applyHideFilter();
});
</script>
