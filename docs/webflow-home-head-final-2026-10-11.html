/* =========================================================
   L4 — RESPONSIVE 3-CARD SYSTEM
   ========================================================= */

.l4-section {
  width: 100%;
  margin: 0;
  padding: 0;

  --l4-card-width: 330px;
  --l4-card-height: 400px;
  --l4-card-gap: 16px;
}


/* =========================================================
   HORIZONTAL VIEWPORT
   ========================================================= */

.l4-section-bg {
  width: 100%;

  overflow-x: auto;
  overflow-y: hidden;

  -webkit-overflow-scrolling: touch;
}


/* =========================================================
   3 CARD ROW
   ========================================================= */

.l4-section-flex {
  display: flex;
  flex-direction: row;
  align-items: stretch;

  gap: var(--l4-card-gap);

  width: max-content;

  margin-left: auto;
  margin-right: auto;
}


/* =========================================================
   CARD
   ========================================================= */

.l4-card {
  width: var(--l4-card-width);
  height: var(--l4-card-height);

  flex: 0 0 var(--l4-card-width);
}


/* =========================================================
   CARD INNER
   ========================================================= */

.l4-card-inner {
  width: 100%;
  height: 100%;

  box-sizing: border-box;

  padding: var(--l4-card-padding, 19px);

  display: flex;
  flex-direction: column;

  container-type: inline-size;
}


/* =========================================================
   COPY
   ========================================================= */

.l4-copy {
  width: 100%;
  height: 100%;

  display: flex;
  flex-direction: column;
}


/* =========================================================
   KICKER
   ========================================================= */

.l4-kicker {
  width: 100%;
  flex: 0 0 auto;
}

.l4-kicker h5 {
  margin: 0;

  font-size: var(--l4-kicker-font, 14px);
  line-height: 1.2;
}


/* =========================================================
   HEADING
   ========================================================= */

.l4-h {
  width: 100%;

  flex: 0 0 auto;

  margin-top: 18px;
}

.l4-h h2 {
  margin: 0;

  
  

  

  text-wrap: balance;

  overflow-wrap: normal;
  word-break: normal;

}


/* =========================================================
   HEADING LINE STATES
   ========================================================= */

.l4-h.is-line-1 h2 {
  
  

}

.l4-h.is-line-2 h2 {
  
  

}

.l4-h.is-line-3 h2 {
  
  

}

.l4-h.is-line-4plus h2 {
  
  

}


/* =========================================================
   PARAGRAPH
   ========================================================= */

.l4-p {
  width: 100%;

  flex: 0 0 auto;

  margin-top: auto;
  padding-top: 24px;
}

.l4-p p {
  margin: 0;

  font-size: var(--l4-p-font, 15px);
  line-height: var(--l4-p-line, 1.35);
}

.l4-p p + p {
  margin-top: 0.85em;
}



  /* =========================================================
   L4 CARD NAVIGATION
   ADDITIVE — DOES NOT REPLACE EXISTING L4 SYSTEM
   ========================================================= */

.l4-section-bg {
  scroll-behavior: smooth;

  overflow-x: auto;
  overflow-y: hidden;

  overscroll-behavior-x: contain;

  /* Preserve horizontal swipe AND normal vertical page scroll */
  touch-action: pan-x pan-y;

  scroll-snap-type: x proximity;

  scrollbar-width: none;

  -webkit-overflow-scrolling: touch;
}

.l4-section-bg::-webkit-scrollbar {
  display: none;
}


/* =========================================================
   CARD SNAP
   ========================================================= */

.l4-card {
  scroll-snap-align: start;
}


/* =========================================================
   DESKTOP GRAB
   Only shown when horizontal scrolling is actually available.
   ========================================================= */

@media (pointer: fine) {

  .l4-section-bg.is-scrollable {
    cursor: grab;
  }

  .l4-section-bg.is-scrollable.is-dragging {
    cursor: grabbing;
  }

}


/* =========================================================
   ACTIVE DRAG

   Temporarily disable snap/smooth behavior while the
   pointer is physically moving the track.
   ========================================================= */

.l4-section-bg.is-dragging {
  scroll-behavior: auto;
  scroll-snap-type: none;
}

.l4-section-bg.is-dragging,
.l4-section-bg.is-dragging * {
  user-select: none;
}


/* =========================================================
   CONTROLS
   ========================================================= */

.l4-controls {
  display: flex;
  align-items: center;
  justify-content: flex-end;

  gap: 12px;

  margin-top: 20px;
}

.l4-controls[hidden],
.l4-prev[hidden],
.l4-next[hidden] {
  display: none !important;
}


/* =========================================================
   L5 ISOLATED DYNAMIC TYPE SYSTEM
   ========================================================= */

.l5-section,
.l5-section * {
  box-sizing: border-box;
}


/* =========================================================
   ROOT

   No 100vw.
   No negative full-bleed margins.
   ========================================================= */

.l5-section {
  position: relative;

  width: 100%;
  max-width: none;

  margin: 0;
  padding: 0;

  display: block;
  overflow: visible;

   ========================================================= */

  position: relative;

  width: 100%;
  max-width: none;

  margin: 0;
  padding: 0;

  display: block;

/* =========================================================
   COPY + FLUID GUTTERS

   This is the only horizontal gutter owner.
   ========================================================= */

.l5-section .l5-copy {
  position: relative;

  container-type: inline-size;

  width: 100%;
  max-width: 1680px;
  min-width: 0;

  margin-inline: auto;

  padding-inline: clamp(
    20px,
    4vw,
    64px
  );

  display: block;

   RESPONSIVE HEIGHT

   Minimum height preserves the overall design.
   Padding guarantees breathing room.
   Content-heavy sections can grow beyond the minimum.
   ========================================================= */

.l5-section .l5-height {
  position: relative;

  width: 100%;
  max-width: none;

  height: auto;

    420px,
