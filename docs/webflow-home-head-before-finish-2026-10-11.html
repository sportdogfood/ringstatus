<style id="rs-public-shared-styles-v1">


/* =========================================================
   L4 — RESPONSIVE 3-CARD SYSTEM
   ========================================================= */

.l4-section {
  width: 100%;
  margin: 0;
  padding: 0;

  --l4-card-width: 330px;
  --l4-card-height: 400px;
  --l4-card-gap: 16px;
}


/* =========================================================
   HORIZONTAL VIEWPORT
   ========================================================= */

.l4-section-bg {
  width: 100%;

  overflow-x: auto;
  overflow-y: hidden;

  -webkit-overflow-scrolling: touch;
}


/* =========================================================
   3 CARD ROW
   ========================================================= */

.l4-section-flex {
  display: flex;
  flex-direction: row;
  align-items: stretch;

  gap: var(--l4-card-gap);

  width: max-content;

  margin-left: auto;
  margin-right: auto;
}


/* =========================================================
   CARD
   ========================================================= */

.l4-card {
  width: var(--l4-card-width);
  height: var(--l4-card-height);

  flex: 0 0 var(--l4-card-width);
}


/* =========================================================
   CARD INNER
   ========================================================= */

.l4-card-inner {
  width: 100%;
  height: 100%;

  box-sizing: border-box;

  padding: var(--l4-card-padding, 19px);

  display: flex;
  flex-direction: column;

  container-type: inline-size;
}


/* =========================================================
   COPY
   ========================================================= */

.l4-copy {
  width: 100%;
  height: 100%;

  display: flex;
  flex-direction: column;
}


/* =========================================================
   KICKER
   ========================================================= */

.l4-kicker {
  width: 100%;
  flex: 0 0 auto;
}

.l4-kicker h5 {
  margin: 0;

  font-size: var(--l4-kicker-font, 14px);
  line-height: 1.2;
}


/* =========================================================
   HEADING
   ========================================================= */

.l4-h {
  width: 100%;

  flex: 0 0 auto;

  margin-top: 18px;
}

.l4-h h2 {
  margin: 0;

  font-size: var(--l4-h-font, 38px);
  line-height: var(--l4-h-line, 0.94);

  letter-spacing: var(--l4-h-track, -0.04em);

  text-wrap: balance;

  overflow-wrap: normal;
  word-break: normal;
}


/* =========================================================
   HEADING LINE STATES
   ========================================================= */

.l4-h.is-line-1 h2 {
  line-height: 0.90;
  letter-spacing: -0.05em;
}

.l4-h.is-line-2 h2 {
  line-height: 0.94;
  letter-spacing: -0.045em;
}

.l4-h.is-line-3 h2 {
  line-height: 0.98;
  letter-spacing: -0.035em;
}

.l4-h.is-line-4plus h2 {
  line-height: 1.02;
  letter-spacing: -0.025em;
}


/* =========================================================
   PARAGRAPH
   ========================================================= */

.l4-p {
  width: 100%;

  flex: 0 0 auto;

  margin-top: auto;
  padding-top: 24px;
}

.l4-p p {
  margin: 0;

  font-size: var(--l4-p-font, 15px);
  line-height: var(--l4-p-line, 1.35);
}

.l4-p p + p {
  margin-top: 0.85em;
}



  /* =========================================================
   L4 CARD NAVIGATION
   ADDITIVE — DOES NOT REPLACE EXISTING L4 SYSTEM
   ========================================================= */

.l4-section-bg {
  scroll-behavior: smooth;

  overflow-x: auto;
  overflow-y: hidden;

  overscroll-behavior-x: contain;

  /* Preserve horizontal swipe AND normal vertical page scroll */
  touch-action: pan-x pan-y;

  scroll-snap-type: x proximity;

  scrollbar-width: none;

  -webkit-overflow-scrolling: touch;
}

.l4-section-bg::-webkit-scrollbar {
  display: none;
}


/* =========================================================
   CARD SNAP
   ========================================================= */

.l4-card {
  scroll-snap-align: start;
}


/* =========================================================
   DESKTOP GRAB
   Only shown when horizontal scrolling is actually available.
   ========================================================= */

@media (pointer: fine) {

  .l4-section-bg.is-scrollable {
    cursor: grab;
  }

  .l4-section-bg.is-scrollable.is-dragging {
    cursor: grabbing;
  }

}


/* =========================================================
   ACTIVE DRAG

   Temporarily disable snap/smooth behavior while the
   pointer is physically moving the track.
   ========================================================= */

.l4-section-bg.is-dragging {
  scroll-behavior: auto;
  scroll-snap-type: none;
}

.l4-section-bg.is-dragging,
.l4-section-bg.is-dragging * {
  user-select: none;
}


/* =========================================================
   CONTROLS
   ========================================================= */

.l4-controls {
  display: flex;
  align-items: center;
  justify-content: flex-end;

  gap: 12px;

  margin-top: 20px;
}

.l4-controls[hidden],
.l4-prev[hidden],
.l4-next[hidden] {
  display: none !important;
}


/* =========================================================
   L5 ISOLATED DYNAMIC TYPE SYSTEM
   ========================================================= */

.l5-section,
.l5-section * {
  box-sizing: border-box;
}


/* =========================================================
   ROOT

   No 100vw.
   No negative full-bleed margins.
   ========================================================= */

.l5-section {
  position: relative;

  width: 100%;
  max-width: none;

  margin: 0;
  padding: 0;

  display: block;
  overflow: visible;
}


/* =========================================================
   BACKGROUND
   ========================================================= */

.l5-section .l5-section-bg {
  position: relative;

  width: 100%;
  max-width: none;

  margin: 0;
  padding: 0;

  display: block;
}


/* =========================================================
   COPY + FLUID GUTTERS

   This is the only horizontal gutter owner.
   ========================================================= */

.l5-section .l5-copy {
  position: relative;

  container-type: inline-size;

  width: 100%;
  max-width: 1680px;
  min-width: 0;

  margin-inline: auto;

  padding-inline: clamp(
    20px,
    4vw,
    64px
  );

  display: block;
}


/* =========================================================
   RESPONSIVE HEIGHT

   Minimum height preserves the overall design.
   Padding guarantees breathing room.
   Content-heavy sections can grow beyond the minimum.
   ========================================================= */

.l5-section .l5-height {
  position: relative;

  width: 100%;
  max-width: none;

  height: auto;

  min-height: clamp(
    420px,
    30.945vw,
    860px
  );

  margin: 0;

  padding-block: 64px;
  padding-inline: 0;

  display: flex;
  align-items: center;
}


/* =========================================================
   INNER

   Copy owns horizontal gutters.
   Height owns vertical spacing.
   ========================================================= */

.l5-section .l5-inner {
  position: relative;

  width: 100%;
  max-width: 1480px;

  height: auto;
  min-height: 0;

  margin-inline: auto;
  padding: 0;

  display: block;
}


/* =========================================================
   CONTENT WRAPPER

.l5-section .l5-content-wrapper {

/* RingStatus selected public pages — shared contract, 2026-10-06.
   Existing classes retained. L5 keeps its established 1680px container.
   Page code owns the scope; this is not a site-wide stylesheet. */
:root {
  --rs-font: "Outfit", sans-serif;
  --rs-body-size: clamp(16px, calc(5.3px + 1.08vw), 26px);
  --rs-paragraph-size: clamp(19px, calc(5.3px + 1.08vw), 26px);
  --rs-heading-size: clamp(54px, calc(-12.43px + 6.696vw), 116px);
  --rs-heading-xl-size: clamp(54px, 9.54vw, 130px);
  --rs-h2-size: clamp(26px, 3.52vw, 48px);
  --rs-h3-size: clamp(26px, calc(11px + 1.51vw), 40px);
  --rs-h4-size: clamp(20px, 1.834vw, 25px);
  --rs-kicker-size: clamp(14px, 1.2vw, 16px);
  --rs-nav-size: clamp(14px, calc(6.76px + .729vw), 20.7px);
  --rs-nav-line: clamp(18.2px, calc(11.06px + .720vw), 24.9px);
  --rs-gutter: 75px;
  --rs-section-space: clamp(64px, 5vw, 96px);
  --rs-stack-space: clamp(16px, 2vw, 32px);
  --rs-control-space: clamp(10px, 1.5vw, 30px);
  --rs-control-height: 44px;
  --rs-content-max: 1600px;
}
body { font-family:var(--rs-font); }
h1,h2,h3,h4,h5,p { font-family:var(--rs-font); margin-top:0; }
h1,h2,h3,h4,h5 { font-weight:600; }
h1 { font-size:var(--rs-heading-size); }
h2 { font-size:var(--rs-h2-size); line-height:.95; letter-spacing:-.05em; }
h3 { font-size:var(--rs-h3-size); line-height:.95; }
h4 { font-size:var(--rs-h4-size); line-height:1; letter-spacing:-.03em; }
h5 { font-size:var(--rs-kicker-size); line-height:1.2; }
p { font-size:var(--rs-body-size); line-height:1.3; }
.l5-paragraph-white,.l5-paragrapg-dark {
  font-size:var(--rs-paragraph-size); line-height:1.3;
}
.rs10-h1-xl,.rs10-h1-xl.is-white,.rs10-h1-xl.is-white-2,
.rs10-h1-xl.is-rust,.rs10-h1-xl.is-color-9,.rs10-h1-xl.is-yellow,
.rs6-hxl,.rs6-hxl.is-white,.rs6-hxl.is-white-2,
.rs6-hxl.is-color-is-err,.rs6-hxl.is-color-9,.rs6-hxl.is-yellow {
  font-size:var(--rs-heading-xl-size); line-height:1;
}

.l5-section .l5-kicker h5,.l4-kicker h5,.rs-h5-card-kicker {

  font-weight:600; line-height:1.2;
}
.rs10-stack { width:100%; min-width:0; }
.l5-section .l5-height { height:auto; padding-block:var(--rs-section-space); }
.rs-custom-nav-center,.rs10-footer-wrapper {
  box-sizing:border-box; width:100%; max-width:var(--rs-content-max);
  margin-inline:auto; padding-inline:var(--rs-gutter); min-width:0;
}
.rs10-footer-wrapper { padding-block:var(--rs-stack-space); }
