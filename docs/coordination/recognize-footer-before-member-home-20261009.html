function normalizeMessage(body, alert) {
	const lines = body.split("\n").map((v) => v.trim()).filter(Boolean);
	const rows = [];
	const name = (value) => {
		const ids = value.match(/\((\d+(?:,\s*\d+)*)\)/);
		return {
			name: value.replace(/\s*\((\d+(?:,\s*\d+)*)\)/, "").replace(/\.$/, "").trim(),
			classIds: ids ? ids[1].split(/,\s*/) : []
		};
	};
	const make = (value, status) => ({
		...name(value),
		status,
		tokens: [],
		entries: []
	});
	const fields = (line, row) => {
		for (const part of line.split("|")) {
			const m = part.trim().match(/^([^:]+):\s*(.+)$/);
			if (!m) continue;
			const label = m[1].trim(), value = m[2].trim();
			if (/^(Start|Starts|Go)$/.test(label)) row.start = value;
			else row.tokens.push({
				label: /^(Ends|Projected end)$/.test(label) ? "Ends in" : /^(In|Till|Mins till go)$/.test(label) ? "Starts in" : label,
				value
			});
		}
	};
	for (const line of lines) {
		const record = line.match(/^(Now|Next|First|Current group):\s*(.+)$/i);
		if (record) {
			rows.push(make(record[2], record[1] === "Current group" ? "NOW" : record[1].toUpperCase()));
			continue;
		}
		if (/^(Start|Starts|Go|\|?Gone):/.test(line) && rows.length) {
			fields(line, rows.at(-1));
			continue;
		}
	}
	if (rows.length) {
		const late = lines.find((v) => /^Running Late/i.test(v));
		if (late) rows[0].tokens.unshift({
			label: "Late",
			value: late.replace(/^Running Late about /i, "")
		});
		return rows;
	}
	const compact = lines.find((v) => /^\d{1,2}:\d{2}\s*[AP]M?\s*\|/i.test(v));
	if (compact) {
		const parts = compact.split("|").map((v) => v.trim());
		const row = make(parts[2], alert === "2nd reminder" || lines.some((v) => /2nd Reminder/i.test(v)) ? "2ND" : "NEXT");
		row.start = parts[0];
		row.entries = parts.slice(3).flatMap((v) => v.split(/,\s*/));
		return [row];
	}
	const trip = body.match(/^.+? — (Ring \d+)\. ([^.]+)\. (.+?)\. Scheduled ([^.]+)\. Latest go ([^.]+)\.(?: Ring walk ([^.]+)\.)?$/);
	if (trip) {
		const row = make(trip[3].replace(/\. Back #\d+$/, ""), "GO");
		const back = trip[3].match(/Back #(\d+)/);
		row.start = trip[4];
		row.entries = [trip[2]];
		row.tokens = [{
			label: "Ring",
			value: trip[1].replace("Ring ", "")
		}, {
			label: "Latest go",
			value: trip[5]
		}];
		if (back) row.tokens.push({
			label: "Back #",
			value: back[1]
		});
		if (trip[6]) row.tokens.push({
			label: "Ring walk",
			value: trip[6]
		});
		return [row];
	}
	if (/^Go:/.test(body)) {
		const row = make("Go time", "GO");
		fields(body, row);
		return [row];
	}
	return [];
}

  function validateSetup(kind,d){if(!d.name.trim())return 'Enter a '+names[kind].toLowerCase()+' name.';if(kind!=='barn'&&!store.barns.some(b=>b.id===store.selectedBarn))return 'Add a barn first.';if(items(kind).some(i=>i.id!==d.id&&i.name.trim().toLocaleLowerCase()===d.name.trim().toLocaleLowerCase()))return names[kind]+' already exists in this barn. Edit the existing record.';if(kind==='users'&&d.email&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(d.email.trim()))return 'Enter a valid email address or leave it blank.';for(const [key,kind]of [['userId','users'],['riderId','riders'],['locationId','locations']])if(d[key]&&!items(kind).some(i=>i.id===d[key]))return 'Choose a '+names[kind].toLowerCase()+' in this barn.';return '';}

  function renderFeed(){if(!container('feed'))return;const filter=(key,label,values)=>`<label class="rings-field">${label}<select data-rs-feed-filter="${key}"><option value="all">All ${label.toLowerCase()}s</option>${values.map(v=>`<option ${feed[key]===v?'selected':''}>${esc(v)}</option>`).join('')}</select></label>`;container('feed').innerHTML=`<div class="rings-schedule-ui"><h1>Notifications</h1><p class="rings-help">Your SMS replies and updates, together in one history.</p><div class="rings-scope">${['all','reply','update','support'].map(k=>action(k==='all'?'All':k==='reply'?'SMS replies':k==='update'?'Updates':'Help','feed-kind',`data-value="${k}" aria-pressed="${feed.kind===k}"`,'rings-pill')).join('')}</div><form class="rings-control-stack" data-rs-form="controls">${field('Search messages','query',feed.query)}<div class="rings-filter-grid">${filter('ring','Ring',[...new Set(RS_DRAFT_MODEL.notificationSamples.flatMap(r=>r.ring?[r.ring]:[]))])}${filter('rider','Rider',[...new Set(RS_DRAFT_MODEL.notificationSamples.flatMap(r=>r.rider?[r.rider]:[]))])}</div><label class="rings-rollups-toggle"><input type="checkbox" data-rs-unread ${feed.unread?'checked':''}>Unread only</label>${action('Clear filters','feed-clear','','rings-link')}</form><div class="rings-schedule-toolbar"><p class="rings-help" role="status" data-rs-feed-count></p>${action('Mark shown as read','feed-read','','rings-link')}</div><p class="rings-error" role="alert">${esc(errors.feed||'')}</p><div data-rs-feed-list class="rings-schedule"></div>${note('14 sample messages, including one sponsor variation. Read state is saved in this browser; no live SMS connection.')}</div>`;renderFeedList();}

  let dialog=null,opener=null,surfaceType='';

  function showSurface(title,content,variant='flyup',type='',newOpener=null){if(newOpener)opener=newOpener;if(dialog){dialog.close();dialog.remove();}surfaceType=type;dialog=document.createElement('dialog');dialog.className='bottom-sheet';dialog.dataset.variant=variant;dialog.innerHTML=`<div class="rings-surface" data-variant="${variant}" data-title-role="${type==='schedule'?'record':'surface'}"><header class="sheet-header rings-context-heading ${type==='schedule'?'rings-ring-head':''}"><h2 class="sheet-title" id="rs-draft-surface-title">${esc(title)}</h2>${action('×','close','aria-label="Close '+esc(title)+'"','rings-surface-close rings-icon')}</header><div class="sheet-content">${content}</div></div>`;dialog.setAttribute('aria-labelledby','rs-draft-surface-title');(root.matches('.rings-combined')?root:root.querySelector('.rings-combined')).append(dialog);dialog.addEventListener('cancel',e=>{e.preventDefault();close();});dialog.addEventListener('click',e=>{if(e.target===dialog){const b=dialog.getBoundingClientRect();if(e.clientX<b.left||e.clientX>b.right||e.clientY<b.top||e.clientY>b.bottom)close();}});dialog.showModal();}

  root.addEventListener('click',event=>{const button=event.target.closest('[data-rs-action]');if(!button||!root.contains(button))return;const a=button.dataset.rsAction;if(a==='close'){close();return;}

  root.addEventListener('input',event=>{const e=event.target,form=e.closest('form');if(e.dataset.rsField&&form?.dataset.rsForm==='setup'){const target=form.dataset.sheet==='true'?frames.at(-1)?.draft:drafts[tab];if(target)target[e.name]=e.value;errors.setup='';form.querySelector('[data-rs-error]').textContent='';}if(e.dataset.rsField&&form?.dataset.rsForm==='alerts'){if(e.name==='phone')alerts.phone=e.value;else if(alerts.variables[e.name])alerts.variables[e.name].value=e.value;errors.alerts='';form.querySelector('[data-rs-error]').textContent='';form.querySelector('[data-rs-status]').textContent='';}if(e.name==='query'&&e.closest('[data-rs-template=feed]')){feed.query=e.value;renderFeedList();}});
  root.addEventListener('change',event=>{const e=event.target;if(e.hasAttribute('data-rs-barn')){const next={...store,selectedBarn:e.value};if(persist('setup',next)){store=next;drafts=Object.fromEntries(kinds.map(k=>[k,blank()]));drafts.barn={...blank(),...store.barns.find(b=>b.id===e.value)};}renderSetup();}if(e.hasAttribute('data-rs-rollups')){schedule.rollups=e.checked;renderSchedule();}if(e.hasAttribute('data-rs-sms')){alerts.enabled=e.checked;errors.alerts='';renderAlerts();}if(e.hasAttribute('data-rs-alert')){alerts.variables[e.dataset.rsAlert].enabled=e.checked;errors.alerts='';renderAlerts();}if(e.hasAttribute('data-rs-unread')){feed.unread=e.checked;renderFeedList();}if(e.dataset.rsFeedFilter){feed[e.dataset.rsFeedFilter]=e.value;renderFeedList();}});

ed. No email was sent.':'No sample profile matched. No email was sent.';}renderRecognition();showRecognition();return;}}form.querySelector('[data-rs-error]').textContent=errors.recognize;}

<script data-rs-native-loader="v1">
window.Webflow = window.Webflow || [];
window.Webflow.push(async function () {
  const root = document.getElementById("rs-native-recognize");
  if (!root || root.getAttribute("data-rs-native-enabled") !== "true" ||
      root.getAttribute("data-rs-native-click-ownership") !== "adapter") return;
  try {
    const module = await import("/test/rs-recognition/native-client.js");
    const present = module.createNativeRecognitionPresenter({ root, ix3: window.Webflow.require("ix3") });
    module.mountNativeRecognition({ root, present, baseUrl: new URL("/test/rs-recognition/", window.location.origin).href });
  } catch {
    root.setAttribute("data-rs-native-load-status", "unavailable");
  }
