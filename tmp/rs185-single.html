<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RS185 Single Viewport Test</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600&display=swap" rel="stylesheet">
  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background: #fff;
    }

    .rs185,
    .rs185 * {
      box-sizing: border-box;
    }

    .rs185 {
      --stage-h: 100%;
      --inner-w: 100%;
      --media-col: 50%;
      --copy-col: 50%;
      --col-gap: 0px;
      --image-h: 100%;
      --copy-w: 60%;
      --copy-gap: clamp(14px, 1.5vw, 24px);
      --h1-size: clamp(48px, 4.35vw, 86px);
      --p-size: clamp(17px, 1.35vw, 25px);

      width: 100%;
      height: 100%;
      min-height: 95svh;
      overflow: hidden;
      background: #fff;
      color: #000;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .rs185__inner {
      width: var(--inner-w);
      height: 100%;
      min-height: 95svh;
      display: grid;
      grid-template-columns: var(--media-col) var(--copy-col);
      column-gap: var(--col-gap);
      align-items: center;
    }

    .rs185__media {
      height: 100%;
      min-width: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .rs185__image {
      display: block;
      width: auto;
      height: var(--image-h);
      max-width: 100%;
      max-height: 95svh;
      object-fit: contain;
    }

    .rs185__copy {
      width: var(--copy-w);
      max-width: 860px;
      min-width: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
      gap: var(--copy-gap);
      margin-right: auto;
      margin-left: auto;
    }

    .rs185__h1 {
      margin: 0;
      font-family: Outfit, sans-serif;
      color: #000;
      font-size: var(--h1-size);
      line-height: 0.95;
      font-weight: 600;
      letter-spacing: -0.065em;
    }

    .rs185__p {
      margin: 0;
      max-width: 760px;
      font-family: Outfit, sans-serif;
      color: #000;
      font-size: var(--p-size);
      line-height: 1.38;
      font-weight: 400;
      letter-spacing: 0;
    }

    @media screen and (min-width: 1440px) {
      .rs185 {
        --h1-size: clamp(64px, 4.55vw, 104px);
        --p-size: clamp(20px, 1.3vw, 29px);
      }
    }

    @media screen and (min-width: 992px) and (max-width: 1279px) {
      .rs185 {
        --copy-gap: clamp(10px, 1.4vw, 18px);
        --h1-size: clamp(40px, 4.2vw, 54px);
        --p-size: clamp(15px, 1.45vw, 18px);
      }
    }

    @media screen and (min-width: 768px) and (max-width: 991px) {
      .rs185 {
        --copy-gap: 10px;
        --h1-size: clamp(32px, 4.15vw, 40px);
        --p-size: clamp(14px, 1.7vw, 16px);
      }

      .rs185__p {
        line-height: 1.34;
      }
    }

    @media screen and (max-width: 767px) {
      .rs185 {
        --inner-w: 100%;
        --image-h: 100%;
        --copy-w: 100%;
        --copy-gap: clamp(12px, 1.8svh, 16px);
        --h1-size: clamp(24px, 6.4vw, 34px);
        --p-size: clamp(11px, 3.2vw, 14px);
      }

      .rs185__inner {
        height: 100%;
        min-height: 95svh;
        grid-template-columns: 50% 50%;
        align-items: center;
      }

      .rs185__media {
        height: 100%;
        align-items: center;
      }

      .rs185__copy {
        width: 60%;
        padding-top: 0;
      }

      .rs185__p {
        line-height: 1.36;
      }
    }

    @media screen and (max-width: 479px) {
      .rs185 {
        --copy-gap: 12px;
        --h1-size: clamp(22px, 6vw, 28px);
        --p-size: clamp(10px, 3vw, 12px);
      }
    }
  </style>
</head>
<body>
  <section class="rs185">
    <div class="rs185__inner">
      <div class="rs185__media">
        <img
          class="rs185__image"
          src="https://cdn.prod.website-files.com/6a034c204cee22f92347e6b9/6a034cd2ecedfe0ddb03c874_blue.avif"
          alt=""
        >
      </div>

      <div class="rs185__copy">
        <h1 class="rs185__h1">I built this because being ready matters.</h1>
        <p class="rs185__p">
          I am a junior rider and working student. I ride a lot, work a lot, and spend enough time at shows to know when something is making the day harder than it needs to be.
        </p>
      </div>
    </div>
  </section>
</body>
</html>
