<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>RS185 Contact Sheet</title>
  <style>
    body {
      margin: 0;
      padding: 18px;
      background: #e9e9e9;
      font-family: Arial, sans-serif;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 18px;
      align-items: start;
    }

    figure {
      margin: 0;
      background: #fff;
      border: 1px solid #aaa;
    }

    figcaption {
      padding: 8px 10px;
      background: #111;
      color: #fff;
      font-size: 14px;
      font-weight: 700;
    }

    img {
      display: block;
      width: 100%;
      height: auto;
    }
  </style>
</head>
<body>
  <div class="grid">
    <figure><figcaption>1280 x 720</figcaption><img src="rs185-1280x720.png"></figure>
    <figure><figcaption>1366 x 768</figcaption><img src="rs185-1366x768.png"></figure>
    <figure><figcaption>1440 x 900</figcaption><img src="rs185-1440x900.png"></figure>
    <figure><figcaption>1440 x 1000</figcaption><img src="rs185-1440x1000.png"></figure>
    <figure><figcaption>1536 x 864</figcaption><img src="rs185-1536x864.png"></figure>
    <figure><figcaption>1920 x 1080</figcaption><img src="rs185-1920x1080.png"></figure>
    <figure><figcaption>1024 x 768</figcaption><img src="rs185-1024x768.png"></figure>
    <figure><figcaption>992 x 720</figcaption><img src="rs185-992x720.png"></figure>
    <figure><figcaption>768 x 1024</figcaption><img src="rs185-768x1024.png"></figure>
    <figure><figcaption>390 x 844</figcaption><img src="rs185-390x844.png"></figure>
  </div>
</body>
</html>
